<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Smart-App</title>

<style>
:root{
  --bg:#252a33;
  --card:#303640;
  --border:#3b424d;
  --text:#fff;
  --muted:rgba(255,255,255,.56);
  --faint:rgba(255,255,255,.28);
  --cyan:#00f0ff;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(900px,100%);
  min-height:330px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:11px;
  padding:38px 45px;
  display:flex;
  align-items:center;
  gap:40px;
}

.icon{
  width:125px;
  height:125px;
  border-radius:22px;
  background:#20242b;
  border:3px solid rgba(255,255,255,.14);
  display:grid;
  place-items:center;
  color:var(--cyan);
  font-size:55px;
  font-weight:800;
  flex:0 0 auto;
}

.content{
  min-width:0;
  flex:1;
}

h1{
  margin:0;
  font-size:28px;
  font-weight:800;
}

.description{
  margin-top:10px;
  max-width:560px;
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.download{
  display:inline-block;
  margin-top:22px;
  padding:9px 20px;
  border:0;
  border-radius:999px;
  background:var(--cyan);
  color:#071014;
  text-decoration:none;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}

.download:hover{
  filter:brightness(1.04);
}

.file{
  margin-top:9px;
  color:var(--faint);
  font-size:9px;
}

.status{
  margin-top:8px;
  color:var(--faint);
  font-size:9px;
}

@media(max-width:650px){
  .card{
    min-height:auto;
    padding:30px 25px;
    flex-direction:column;
    text-align:center;
    gap:22px;
  }

  .description{
    max-width:none;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="icon">S</div>

  <div class="content">

    <h1>Smart-App</h1>

    <div class="description">
      Smart-App es la aplicación de Smartium para Android.
      Desde aquí puedes descargar la aplicación oficial en formato APK
      e instalarla en un dispositivo Android compatible.
    </div>

    <a
      id="downloadBtn"
      class="download"
      href="https://heaven-voices-values-storage/download"
      download="Smart-App.apk"
    >
      Descargar Smart-App
    </a>

    <div class="file">
      Smart-App.apk
    </div>

    <div id="status" class="status"></div>

  </div>

</div>

<script>
const AUTH_URL = "https://smartium25.github.io/auth";
const TOKEN_KEY = "knfoundation_token";

/*
  Pon aquí la URL pública del API que sirve Smart-App.apk.

  Mientras pruebas localmente:
  http://127.0.0.1:8000

  Cuando uses Cloudflare:
  https://tu-url.trycloudflare.com
*/
const DOWNLOAD_API = "https.//heaven-voices-values-storage.trycloudflare.com";


/* ============================================================
   COMPROBAR AUTENTICACIÓN
   ============================================================ */

function checkAuth(){

  const token = localStorage.getItem(TOKEN_KEY);

  if(token){
    return true;
  }

  const returnUrl = window.location.href;

  const loginUrl =
    AUTH_URL +
    "?redirect=" +
    encodeURIComponent(returnUrl);

  window.location.replace(loginUrl);

  return false;
}


/* ============================================================
   DESCARGA
   ============================================================ */

function setupDownload(){

  const button = document.getElementById("downloadBtn");
  const status = document.getElementById("status");

  button.href = DOWNLOAD_API + "/download";

  button.addEventListener("click", () => {
    status.textContent = "Iniciando descarga...";
  });
}


/* ============================================================
   INICIO
   ============================================================ */

if(checkAuth()){
  setupDownload();
}
</script>

</body>
</html>
