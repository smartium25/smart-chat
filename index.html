<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart-Chat · 3PD</title>

<style>
:root{
    --cyan:#00f0ff;
    --bg:#252a33;
    --card:#303640;
    --card2:#2b313b;
    --green:#42d66f;
    --text:#ffffff;
    --muted:#9ea8b3;
    --border:#414956;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

button,
input,
textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    display:grid;
    grid-template-columns:230px minmax(360px,1fr) 250px;
    gap:10px;
    padding:10px;
}


/* =========================================================
   GENERALES
========================================================= */

.panel{
    min-width:0;
    min-height:0;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
}

.header{
    height:52px;
    display:flex;
    align-items:center;
    padding:0 14px;
    border-bottom:1px solid var(--border);
}

.title{
    color:var(--cyan);
    font-size:17px;
    font-weight:bold;
}

.subtitle{
    color:var(--muted);
    font-size:11px;
}


/* =========================================================
   LEFT - USUARIOS
========================================================= */

.left-panel{
    display:flex;
    flex-direction:column;
}

.users-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
}

.users-count{
    font-size:10px;
    color:var(--muted);
}

.users-list{
    flex:1;
    overflow-y:auto;
    padding:8px;
}

.user-card{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px;
    margin-bottom:5px;
    border-radius:9px;
    background:transparent;
    transition:background .15s;
}

.user-card:hover{
    background:var(--card2);
}

.avatar-wrap{
    width:38px;
    height:38px;
    position:relative;
    flex:none;
}

.avatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
    background:#20252d;
    display:block;
}

.status-dot{
    width:9px;
    height:9px;
    position:absolute;
    right:-1px;
    bottom:1px;
    border-radius:50%;
    background:#68727c;
    border:2px solid var(--card);
}

.status-dot.online{
    background:var(--green);
}

.user-info{
    min-width:0;
    flex:1;
}

.username{
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-status{
    margin-top:2px;
    font-size:10px;
    color:var(--muted);
}

.chat-button{
    width:28px;
    height:28px;
    border:0;
    border-radius:7px;
    background:var(--card2);
    color:var(--cyan);
    font-size:13px;
    flex:none;
}

.chat-button:hover{
    background:#3a424e;
}


/* =========================================================
   CENTER
========================================================= */

.center-panel{
    display:flex;
    flex-direction:column;
}

.center-header{
    height:60px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 12px;
    border-bottom:1px solid var(--border);
    flex:none;
}

.chat-avatar{
    width:40px;
    height:40px;
    object-fit:cover;
    border-radius:50%;
    background:#20252d;
    flex:none;
}

.chat-head{
    min-width:0;
    flex:1;
}

.chat-name{
    font-size:14px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-sub{
    margin-top:2px;
    color:var(--muted);
    font-size:10px;
}

.logout-button{
    border:1px solid var(--border);
    background:var(--card2);
    color:#ff6464;
    padding:7px 9px;
    border-radius:7px;
    font-size:10px;
}

.logout-button:hover{
    background:#373d47;
}

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:12px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

.message{
    display:flex;
    margin-bottom:8px;
}

.message.mine{
    justify-content:flex-end;
}

.message-bubble{
    max-width:75%;
    background:var(--card2);
    border-radius:10px;
    padding:8px 10px;
    border:1px solid #3d4550;
}

.message.mine .message-bubble{
    background:#183f45;
    border-color:#21616a;
}

.message-sender{
    color:var(--cyan);
    font-size:10px;
    font-weight:bold;
    margin-bottom:3px;
}

.message-text{
    white-space:pre-wrap;
    word-break:break-word;
    font-size:12px;
    line-height:1.35;
}

.message-time{
    margin-top:4px;
    color:#7f8993;
    font-size:8px;
    text-align:right;
}

.file-box{
    margin-top:5px;
}

.file-box a{
    color:var(--cyan);
    text-decoration:none;
    font-size:11px;
}

.composer{
    min-height:60px;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
    border-top:1px solid var(--border);
    flex:none;
}

.message-input{
    flex:1;
    min-width:0;
    height:39px;
    resize:none;
    outline:none;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--card2);
    color:#fff;
    padding:10px;
    font-size:11px;
}

.message-input:focus{
    border-color:var(--cyan);
}

.attach-button,
.send-button{
    width:39px;
    height:39px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card2);
}

.attach-button{
    color:var(--cyan);
}

.send-button{
    background:var(--cyan);
    border-color:var(--cyan);
    color:#062126;
    font-weight:bold;
}

.send-button:hover{
    filter:brightness(1.08);
}


/* =========================================================
   RIGHT
========================================================= */

.right-panel{
    display:flex;
    flex-direction:column;
    overflow-y:auto;
}

.profile-box{
    padding:15px;
    text-align:center;
    border-bottom:1px solid var(--border);
}

.big-avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    background:#20252d;
    display:block;
    margin:0 auto 9px;
}

.profile-name{
    font-size:14px;
    font-weight:bold;
}

.profile-sub{
    margin-top:3px;
    font-size:10px;
    color:var(--muted);
}

.section{
    padding:12px;
}

.section-title{
    color:var(--cyan);
    font-size:11px;
    font-weight:bold;
    margin-bottom:8px;
}

.group-name-input{
    width:100%;
    height:34px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
    background:var(--card2);
    color:#fff;
    padding:8px;
    font-size:11px;
}

.group-name-input:focus{
    border-color:var(--cyan);
}

.members-list{
    max-height:115px;
    overflow-y:auto;
    margin-top:7px;
    border:1px solid var(--border);
    border-radius:7px;
    padding:5px;
}

.member{
    display:flex;
    align-items:center;
    gap:6px;
    padding:4px;
    font-size:10px;
}

.member input{
    accent-color:var(--cyan);
}

.create-group-button{
    width:100%;
    height:34px;
    margin-top:7px;
    border:0;
    border-radius:7px;
    background:var(--cyan);
    color:#062126;
    font-size:11px;
    font-weight:bold;
}

.groups-list{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.group-card{
    padding:8px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--card2);
    cursor:pointer;
}

.group-card:hover{
    border-color:var(--cyan);
}

.group-card-name{
    font-size:11px;
    font-weight:bold;
}

.group-card-owner{
    margin-top:2px;
    color:var(--muted);
    font-size:9px;
}


/* =========================================================
   SCROLLBARS
========================================================= */

::-webkit-scrollbar{
    width:6px;
    height:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#4a5360;
    border-radius:10px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:900px){

    .app{
        grid-template-columns:200px minmax(300px,1fr);
    }

    .right-panel{
        display:none;
    }

}

@media(max-width:620px){

    .app{
        grid-template-columns:1fr;
    }

    .left-panel{
        display:none;
    }

}
</style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         LEFT
    ====================================================== -->

    <section class="panel left-panel">

        <div class="header">

            <div class="users-title">

                <div class="title">
                    Usuarios
                </div>

                <div
                    id="usersCount"
                    class="users-count"
                >
                    0
                </div>

            </div>

        </div>

        <div
            id="usersList"
            class="users-list"
        ></div>

    </section>


    <!-- =====================================================
         CENTER
    ====================================================== -->

    <section class="panel center-panel">

        <div class="center-header">

            <img
                id="chatAvatar"
                class="chat-avatar"
                alt=""
            >

            <div class="chat-head">

                <div
                    id="chatName"
                    class="chat-name"
                >
                    Smart-Chat
                </div>

                <div
                    id="chatSub"
                    class="chat-sub"
                >
                    Selecciona un usuario
                </div>

            </div>

            <button
                id="logoutButton"
                class="logout-button"
            >
                LOG OUT
            </button>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="empty">
                Selecciona una conversación
            </div>

        </div>


        <div class="composer">

            <input
                id="fileInput"
                type="file"
                accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/ogg"
                hidden
            >

            <button
                id="attachButton"
                class="attach-button"
                title="Adjuntar"
            >
                📎
            </button>

            <textarea
                id="messageInput"
                class="message-input"
                placeholder="Escribe un mensaje..."
            ></textarea>

            <button
                id="sendButton"
                class="send-button"
            >
                ➤
            </button>

        </div>

    </section>


    <!-- =====================================================
         RIGHT
    ====================================================== -->

    <section class="panel right-panel">

        <div class="profile-box">

            <img
                id="myAvatar"
                class="big-avatar"
                alt=""
            >

            <div
                id="myName"
                class="profile-name"
            >
                Cargando...
            </div>

            <div class="profile-sub">
                Kn Foundation
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                Crear grupo
            </div>

            <input
                id="groupName"
                class="group-name-input"
                type="text"
                maxlength="80"
                placeholder="Nombre del grupo"
            >

            <div
                id="membersList"
                class="members-list"
            ></div>

            <button
                id="createGroupButton"
                class="create-group-button"
            >
                CREAR GRUPO
            </button>

        </div>


        <div class="section">

            <div class="section-title">
                Mis Grupos
            </div>

            <div
                id="groupsList"
                class="groups-list"
            ></div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
    "https://dive-still-minneapolis-held.trycloudflare.com";

const KN_AUTH_API =
    "https://programs-sweet-limited-files.trycloudflare.com";

const AUTH_URL =
    "https://smartium25.github.io/auth/";

const TOKEN_KEY =
    "knfoundation_token";


/* =========================================================
   ESTADO
========================================================= */

let me = null;

let usersCache = [];

let groupsCache = [];

let currentType = null;

let currentTarget = null;

let socket = null;

let reconnectTimer = null;

let pingTimer = null;


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function token(){

    return localStorage.getItem(
        TOKEN_KEY
    );

}


function headers(extra = {}){

    const t =
        token();

    return {
        ...extra,
        ...(t
            ? {
                "Authorization":
                    "Bearer " + t
            }
            : {}
        )
    };

}


async function api(
    path,
    options = {}
){

    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers:
                    headers(
                        options.headers || {}
                    )
            }
        );


    if(!response.ok){

        let detail = "";

        try{
            detail =
                await response.text();
        }catch{}


        throw new Error(
            "HTTP " +
            response.status +
            (
                detail
                ? " - " + detail
                : ""
            )
        );

    }


    const type =
        response.headers.get(
            "content-type"
        ) || "";


    if(
        type.includes(
            "application/json"
        )
    ){

        return await response.json();

    }


    return await response.text();

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   PFP
========================================================= */

function pfpUrl(value){

    if(!value){
        return "";
    }


    value =
        String(value);


    if(
        value.startsWith(
            "https://"
        ) ||
        value.startsWith(
            "http://"
        ) ||
        value.startsWith(
            "data:"
        )
    ){

        return value;

    }


    if(
        value.startsWith(
            "/pfp/"
        )
    ){

        return (
            KN_AUTH_API +
            value
        );

    }


    if(
        value.startsWith(
            "/"
        )
    ){

        return (
            KN_AUTH_API +
            value
        );

    }


    return (
        KN_AUTH_API +
        "/" +
        value
    );

}


/* =========================================================
   PERFIL
========================================================= */

async function loadMe(){

    const data =
        await api(
            "/api/me"
        );


    me =
        data.user || data;


    $("myName").textContent =
        me.username || "";


    const avatar =
        pfpUrl(
            me.pfp ||
            me.profile_picture
        );


    if(
        avatar &&
        $("myAvatar").getAttribute(
            "src"
        ) !== avatar
    ){

        $("myAvatar").src =
            avatar;

    }

}


async function refreshMeSilently(){

    if(!me){
        return;
    }


    try{

        const data =
            await api(
                "/api/me"
            );


        const user =
            data.user || data;


        if(
            user.username &&
            $("myName").textContent !==
            user.username
        ){

            $("myName").textContent =
                user.username;

        }


        const avatar =
            pfpUrl(
                user.pfp ||
                user.profile_picture
            );


        if(
            avatar &&
            $("myAvatar").getAttribute(
                "src"
            ) !== avatar
        ){

            $("myAvatar").src =
                avatar;

        }


    }catch(error){

        console.error(
            "Refresh de perfil:",
            error
        );

    }

}


/* =========================================================
   USUARIOS
========================================================= */

async function getUsers(){

    const data =
        await api(
            "/api/users/list/" +
            encodeURIComponent(
                me.username
            )
        );


    return Array.isArray(data)
        ? data
        : (
            data.users ||
            []
        );

}


function updateUserCard(
    card,
    user
){

    const dot =
        card.querySelector(
            ".status-dot"
        );

    const status =
        card.querySelector(
            ".user-status"
        );

    const image =
        card.querySelector(
            ".avatar"
        );


    if(dot){

        dot.classList.toggle(
            "online",
            !!user.online
        );

    }


    if(status){

        const newText =
            user.online
            ? "En línea"
            : "Desconectado";


        if(
            status.textContent !==
            newText
        ){

            status.textContent =
                newText;

        }

    }


    const avatar =
        pfpUrl(
            user.pfp ||
            user.profile_picture
        );


    if(
        image &&
        avatar &&
        image.getAttribute(
            "src"
        ) !== avatar
    ){

        image.src =
            avatar;

    }

}


function createUserCard(
    user
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "user-card";


    card.dataset.username =
        user.username;


    const avatar =
        pfpUrl(
            user.pfp ||
            user.profile_picture
        );


    card.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${escapeHTML(avatar)}"
                alt=""
            >

            <span
                class="status-dot${user.online ? " online" : ""}"
            ></span>

        </div>

        <div class="user-info">

            <div class="username">
                ${escapeHTML(user.username)}
            </div>

            <div class="user-status">
                ${user.online ? "En línea" : "Desconectado"}
            </div>

        </div>

        <button
            class="chat-button"
            title="Abrir chat"
        >
            💬
        </button>
    `;


    card.querySelector(
        ".chat-button"
    )
    .addEventListener(
        "click",
        event => {

            event.stopPropagation();

            openPrivate(
                user.username
            );

        }
    );


    card.addEventListener(
        "dblclick",
        () => {

            openPrivate(
                user.username
            );

        }
    );


    return card;

}


function updateMembersList(
    users
){

    const selected =
        new Set(
            Array.from(
                $("membersList")
                .querySelectorAll(
                    "input[type=checkbox]:checked"
                )
            )
            .map(
                input =>
                    input.value
            )
        );


    $("membersList")
        .innerHTML = "";


    users.forEach(
        user => {

            const label =
                document.createElement(
                    "label"
                );


            label.className =
                "member";


            label.innerHTML = `

                <input
                    type="checkbox"
                    value="${escapeHTML(user.username)}"
                    ${selected.has(user.username) ? "checked" : ""}
                >

                <span>
                    ${escapeHTML(user.username)}
                </span>

            `;


            $("membersList")
                .appendChild(
                    label
                );

        }
    );

}


async function loadUsers(){

    const users =
        await getUsers();


    usersCache =
        users.filter(
            user =>
                user &&
                user.username &&
                user.username !==
                me.username
        );


    renderUsersInitial();

}


function renderUsersInitial(){

    const list =
        $("usersList");


    list.innerHTML =
        "";


    usersCache.forEach(
        user => {

            list.appendChild(
                createUserCard(
                    user
                )
            );

        }
    );


    $("usersCount")
        .textContent =
        usersCache.length;


    updateMembersList(
        usersCache
    );

}


async function refreshUsersSilently(){

    if(!me){
        return;
    }


    let users;


    try{

        users =
            await getUsers();

    }catch(error){

        console.error(
            "Refresh de usuarios:",
            error
        );

        return;

    }


    users =
        users.filter(
            user =>
                user &&
                user.username &&
                user.username !==
                me.username
        );


    usersCache =
        users;


    const list =
        $("usersList");


    const existing =
        new Map();


    list
    .querySelectorAll(
        ".user-card[data-username]"
    )
    .forEach(
        card => {

            existing.set(
                card.dataset.username,
                card
            );

        }
    );


    const valid =
        new Set(
            users.map(
                user =>
                    user.username
            )
        );


    users.forEach(
        user => {

            let card =
                existing.get(
                    user.username
                );


            if(!card){

                card =
                    createUserCard(
                        user
                    );


                list.appendChild(
                    card
                );

                return;

            }


            updateUserCard(
                card,
                user
            );

        }
    );


    existing.forEach(
        (card, username) => {

            if(
                !valid.has(
                    username
                )
            ){

                card.remove();

            }

        }
    );


    $("usersCount")
        .textContent =
        users.length;


    /*
       Actualizamos los checks sin
       destruir los ya existentes.
    */

    updateMembersList(
        users
    );


    /*
       Si el usuario que tienes abierto
       cambió de estado o PFP.
    */

    if(
        currentType ===
        "private" &&
        currentTarget
    ){

        const user =
            users.find(
                item =>
                    item.username ===
                    currentTarget
            );


        if(user){

            const newStatus =
                user.online
                ? "En línea"
                : "Desconectado";


            if(
                $("chatSub")
                .textContent !==
                newStatus
            ){

                $("chatSub")
                    .textContent =
                    newStatus;

            }


            const avatar =
                pfpUrl(
                    user.pfp ||
                    user.profile_picture
                );


            if(
                avatar &&
                $("chatAvatar")
                .getAttribute(
                    "src"
                ) !== avatar
            ){

                $("chatAvatar")
                    .src =
                    avatar;

            }

        }

    }

}

   GRUPOS
========================================================= */

async function loadGroups(){

    const data =
        await api(
            "/api/groups/list/" +
            encodeURIComponent(
                me.username
            )
        );


    groupsCache =
        Array.isArray(data)
        ? data
        : (
            data.groups ||
            []
        );


    renderGroupsInitial();

}


function createGroupCard(
    group
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "group-card";


    card.dataset.groupId =
        String(
            group.id
        );


    card.innerHTML = `

        <div class="group-card-name">
            ${escapeHTML(group.name)}
        </div>

        <div class="group-card-owner">
            ${escapeHTML(group.owner || "")}
        </div>

    `;


    card.addEventListener(
        "click",
        () => {

            openGroup(
                group.id,
                group.name
            );

        }
    );


    return card;

}


function renderGroupsInitial(){

    const list =
        $("groupsList");


    list.innerHTML =
        "";


    groupsCache.forEach(
        group => {

            list.appendChild(
                createGroupCard(
                    group
                )
            );

        }
    );

}


async function refreshGroupsSilently(){

    if(!me){
        return;
    }


    let data;


    try{

        data =
            await api(
                "/api/groups/list/" +
                encodeURIComponent(
                    me.username
                )
            );

    }catch(error){

        console.error(
            "Refresh de grupos:",
            error
        );

        return;

    }


    const groups =
        Array.isArray(data)
        ? data
        : (
            data.groups ||
            []
        );


    groupsCache =
        groups;


    const list =
        $("groupsList");


    const existing =
        new Map();


    list
    .querySelectorAll(
        ".group-card[data-group-id]"
    )
    .forEach(
        card => {

            existing.set(
                card.dataset.groupId,
                card
            );

        }
    );


    const valid =
        new Set();


    groups.forEach(
        group => {

            const id =
                String(
                    group.id
                );


            valid.add(id);


            const card =
                existing.get(id);


            if(!card){

                list.appendChild(
                    createGroupCard(
                        group
                    )
                );

                return;

            }


            const name =
                card.querySelector(
                    ".group-card-name"
                );


            const owner =
                card.querySelector(
                    ".group-card-owner"
                );


            if(name){

                const value =
                    group.name || "";


                if(
                    name.textContent !==
                    value
                ){

                    name.textContent =
                        value;

                }

            }


            if(owner){

                const value =
                    group.owner || "";


                if(
                    owner.textContent !==
                    value
                ){

                    owner.textContent =
                        value;

                }

            }

        }
    );


    existing.forEach(
        (card,id) => {

            if(!valid.has(id)){
                card.remove();
            }

        }
    );

}

/* =========================================================
   MENSAJES
========================================================= */

function messageEndpoint(){

    if(
        currentType ===
        "private"
    ){

        return (
            "/api/chat/get/" +
            encodeURIComponent(
                me.username
            ) +
            "/" +
            encodeURIComponent(
                currentTarget
            )
        );

    }


    return (
        "/api/groups/get/" +
        encodeURIComponent(
            me.username
        ) +
        "/" +
        encodeURIComponent(
            currentTarget
        )
    );

}


function messageKey(
    message
){

    if(
        message.id !== undefined &&
        message.id !== null
    ){

        return String(
            message.id
        );

    }


    return [
        message.sender,
        message.receiver,
        message.date,
        message.message,
        message.file
    ]
    .join("|");

}


function formatTime(
    value
){

    if(!value){
        return "";
    }


    try{

        return new Date(
            value
        )
        .toLocaleTimeString(
            "es-MX",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch{

        return "";

    }

}


function createMessageElement(
    message
){

    const sender =
        message.sender ||
        "";


    const mine =
        sender ===
        me.username;


    const el =
        document.createElement(
            "div"
        );


    el.className =
        "message" +
        (
            mine
            ? " mine"
            : ""
        );


    el.dataset.messageId =
        messageKey(
            message
        );


    let fileHtml =
        "";


    if(message.file){

        let url =
            String(
                message.file
            );


        if(
            !url.startsWith(
                "http://"
            ) &&
            !url.startsWith(
                "https://"
            )
        ){

            url =
                API +
                "/media/chat/" +
                encodeURIComponent(
                    url
                );

        }


        fileHtml = `

            <div class="file-box">

                <a
                    href="${escapeHTML(url)}"
                    target="_blank"
                    rel="noopener"
                >
                    📎 Archivo
                </a>

            </div>

        `;

    }


    el.innerHTML = `

        <div class="message-bubble">

            ${
                !mine && sender
                ?
                `
                <div class="message-sender">
                    ${escapeHTML(sender)}
                </div>
                `
                :
                ""
            }

            ${
                message.message
                ?
                `
                <div class="message-text">
                    ${escapeHTML(message.message)}
                </div>
                `
                :
                ""
            }

            ${fileHtml}

            <div class="message-time">
                ${escapeHTML(
                    formatTime(
                        message.date
                    )
                )}
            </div>

        </div>

    `;


    return el;

}


async function loadMessages(
    forceRender = false
){

    if(
        !currentType ||
        !currentTarget ||
        !me
    ){

        return;

    }


    let data;


    try{

        data =
            await api(
                messageEndpoint()
            );

    }catch(error){

        console.error(
            "Error cargando mensajes:",
            error
        );

        return;

    }


    const messages =
        Array.isArray(data)
        ? data
        : (
            data.messages ||
            []
        );


    const box =
        $("messages");


    /*
       Si cambiamos de chat:
       render completo SOLO una vez.
    */

    if(forceRender){

        box.innerHTML =
            "";


        if(!messages.length){

            box.innerHTML = `
                <div class="empty">
                    No hay mensajes todavía.
                </div>
            `;

            return;

        }


        const fragment =
            document.createDocumentFragment();


        messages.forEach(
            message => {

                fragment.appendChild(
                    createMessageElement(
                        message
                    )
                );

            }
        );


        box.appendChild(
            fragment
        );


        box.scrollTop =
            box.scrollHeight;


        return;

    }


    /*
       REFRESH SILENCIOSO

       No borramos NADA.
       No usamos innerHTML.
       Solamente agregamos mensajes
       que todavía no están.
    */

    const existing =
        new Set();


    box.querySelectorAll(
        ".message[data-message-id]"
    )
    .forEach(
        element => {

            existing.add(
                element.dataset.messageId
            );

        }
    );


    let added = false;


    const fragment =
        document.createDocumentFragment();


    messages.forEach(
        message => {

            const key =
                messageKey(
                    message
                );


            if(
                !existing.has(
                    key
                )
            ){

                fragment.appendChild(
                    createMessageElement(
                        message
                    )
                );

                added = true;

            }

        }
    );


    if(!added){
        return;
    }


    const atBottom =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        80;


    box.appendChild(
        fragment
    );


    if(atBottom){

        box.scrollTop =
            box.scrollHeight;

    }

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

async function sendMessage(){

    if(
        !currentType ||
        !currentTarget
    ){

        return;

    }


    const input =
        $("messageInput");


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    input.value =
        "";


    try{

        if(
            currentType ===
            "private"
        ){

            await api(
                "/api/chat/send",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        receiver:
                            currentTarget,
                        message:
                            text
                    })
                }
            );

        }else{

            await api(
                "/api/groups/send",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        receiver:
                            currentTarget,
                        message:
                            text
                    })
                }
            );

        }


        await loadMessages(
            false
        );


    }catch(error){

        console.error(
            "Error enviando mensaje:",
            error
        );


        input.value =
            text;

    }

}


/* =========================================================
   ARCHIVOS
========================================================= */

async function sendFile(
    file
){

    if(
        !file ||
        !currentType ||
        !currentTarget
    ){

        return;

    }


    const form =
        new FormData();


    if(
        currentType ===
        "private"
    ){

        form.append(
            "receiver",
            currentTarget
        );


        form.append(
            "file",
            file
        );


        try{

            await api(
                "/api/chat/upload",
                {
                    method:"POST",
                    body:form
                }
            );


            await loadMessages(
                false
            );

        }catch(error){

            console.error(
                "Error subiendo archivo:",
                error
            );

        }


    }else{

        form.append(
            "receiver",
            currentTarget
        );


        form.append(
            "file",
            file
        );


        try{

            await api(
                "/api/groups/upload",
                {
                    method:"POST",
                    body:form
                }
            );


            await loadMessages(
                false
            );

        }catch(error){

            console.error(
                "Error subiendo archivo:",
                error
            );

        }

    }

}


/* =========================================================
   CREAR GRUPO
========================================================= */

async function createGroup(){

    const name =
        $("groupName")
            .value
            .trim();


    if(!name){

        return;

    }


    const selected =
        Array.from(
            $("membersList")
            .querySelectorAll(
                "input[type=checkbox]:checked"
            )
        )
        .map(
            input =>
                input.value
        );


    const form =
        new FormData();


    form.append(
        "name",
        name
    );


    form.append(
        "members",
        selected.join(",")
    );


    try{

        await api(
            "/api/groups/create",
            {
                method:"POST",
                body:form
            }
        );


        $("groupName")
            .value =
            "";


        $("membersList")
            .querySelectorAll(
                "input[type=checkbox]"
            )
            .forEach(
                checkbox => {

                    checkbox.checked =
                        false;

                }
            );


        await refreshGroupsSilently();


    }catch(error){

        console.error(
            "Error creando grupo:",
            error
        );

    }

}


/* =========================================================
   WEBSOCKET
========================================================= */

function connectSocket(){

    if(!me){
        return;
    }


    if(
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ){

        return;

    }


    const t =
        token();


    if(!t){
        return;
    }


    const websocketBase =
        API
        .replace(
            "https://",
            "wss://"
        )
        .replace(
            "http://",
            "ws://"
        );


    const url =
        websocketBase +
        "/ws/" +
        encodeURIComponent(
            me.username
        ) +
        "?token=" +
        encodeURIComponent(
            t
        );


    try{

        socket =
            new WebSocket(
                url
            );

    }catch(error){

        console.error(
            "WebSocket:",
            error
        );

        return;

    }


    socket.addEventListener(
        "open",
        () => {

            console.log(
                "Smart-Chat WebSocket conectado"
            );


            if(pingTimer){

                clearInterval(
                    pingTimer
                );

            }


            pingTimer =
                setInterval(
                    () => {

                        if(
                            socket &&
                            socket.readyState ===
                            WebSocket.OPEN
                        ){

                            socket.send(
                                "ping"
                            );

                        }

                    },
                    25000
                );

        }
    );


    socket.addEventListener(
        "message",
        async event => {

            try{

                const data =
                    JSON.parse(
                        event.data
                    );


                if(
                    data.type ===
                    "chat"
                ){

                    /*
                       Solo actualiza mensajes nuevos.
                       No reconstruye el chat.
                    */

                    await loadMessages(
                        false
                    );

                }


            }catch(error){

                console.error(
                    "Error WebSocket:",
                    error
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            if(pingTimer){

                clearInterval(
                    pingTimer
                );

                pingTimer =
                    null;

            }


            if(reconnectTimer){

                clearTimeout(
                    reconnectTimer
                );

            }


            reconnectTimer =
                setTimeout(
                    () => {

                        connectSocket();

                    },
                    3000
                );

        }
    );

}

/* =========================================================
   REFRESH GENERAL SILENCIOSO
========================================================= */

async function refreshEverythingSilently(){

    /*
       IMPORTANTE:

       Esto es el "refresh" periódico,
       pero NO recarga index.html.

       Actualiza toda la información
       necesaria y conserva el DOM.
    */

    await Promise.allSettled([
        refreshMeSilently(),
        refreshUsersSilently(),
        refreshGroupsSilently(),
        loadMessages(false)
    ]);

}


/* =========================================================
   INICIO
========================================================= */

async function init(){

    if(!token()){

        window.location.href =
            AUTH_URL;

        return;

    }


    try{

        await loadMe();

        await loadUsers();

        await loadGroups();

        connectSocket();


        /*
           REFRESH GENERAL CADA 10 SEGUNDOS.

           No hay location.reload().
           No se borra .messages.
           No se reconstruyen los usuarios.
        */

        setInterval(
    () => {

        refreshEverythingSilently()
            .catch(
                error => {
                    console.error(
                        "Refresh general:",
                        error
                    );
                }
            );

    },
    5000
);


    }catch(error){

        console.error(
            "Error iniciando Smart-Chat:",
            error
        );


        $("chatName")
            .textContent =
            "Error";


        $("chatSub")
            .textContent =
            "No se pudo conectar con Smart-Chat";

    }

}


init();
