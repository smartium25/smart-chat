<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Chat</title>

<style>
:root{
--primary:#00bcd4;
--bg:#121212;
--card:#2c2c2c;
--border:#444;
--text:#fff;
--sub:#aaa;
--green:#4caf50;
--red:#f44336;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

/* LOGIN */
#auth{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.box{
width:100%;
max-width:430px;
background:var(--card);
padding:36px;
border-radius:24px;
border:1px solid var(--border);
}

.box h1{
text-align:center;
color:var(--primary);
margin-bottom:10px;
}

.box p{
text-align:center;
color:var(--sub);
margin-bottom:24px;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1d1d1d;
color:#fff;
margin-bottom:12px;
}

button{
border:none;
padding:14px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.full{width:100%;}
.blue{background:var(--primary);color:#000;}

.line{
background:none;
border:1px solid var(--primary);
color:var(--primary);
margin-top:10px;
}

#msg{
text-align:center;
margin-top:15px;
color:var(--sub);
min-height:22px;
}

/* APP */
#app{
display:none;
height:100vh;
}

.wrap{
display:grid;
grid-template-columns:320px 1fr 320px;
height:100vh;
gap:2px;
background:var(--border);
}

.panel{
background:var(--bg);
padding:16px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.title{
background:var(--card);
padding:14px;
border-radius:16px;
text-align:center;
font-weight:700;
color:var(--primary);
margin-bottom:14px;
}

.scroll{
flex:1;
overflow-y:auto;
}

.user{
display:flex;
align-items:center;
gap:10px;
background:var(--card);
padding:10px;
border-radius:14px;
margin-bottom:10px;
}

.user img{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--primary);
}

.online,.offline{
width:10px;
height:10px;
border-radius:50%;
}

.online{background:var(--green);}
.offline{background:#666;}

.name{
flex:1;
font-weight:600;
}

.center{
background:#1a1a1a;
display:flex;
flex-direction:column;
height:100vh;
}

#profile{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
}

.big{
width:170px;
height:170px;
border-radius:50%;
overflow:hidden;
border:4px solid var(--primary);
margin-bottom:20px;
background:var(--card);
}

.big img{
width:100%;
height:100%;
object-fit:cover;
}

#chat{
display:none;
height:100%;
flex-direction:column;
}

#chatHead{
padding:15px;
background:var(--card);
color:var(--primary);
text-align:center;
font-weight:700;
}

#msgs{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:10px 14px;
border-radius:14px;
max-width:72%;
word-break:break-word;
}

.me{
align-self:flex-end;
background:var(--primary);
color:#000;
}

.them{
align-self:flex-start;
background:var(--card);
}

.msg img{
max-width:220px;
border-radius:12px;
}

.msg video{
max-width:240px;
border-radius:12px;
}

.send{
display:flex;
gap:8px;
padding:12px;
background:var(--card);
}

.send input{
margin:0;
}

small{
color:var(--sub);
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="auth">
<div class="box">
<h1>SMART-CHAT</h1>
<p>Inicia sesión o crea cuenta</p>

<input id="user" placeholder="Usuario">
<input id="pass" type="password" placeholder="Contraseña">

<button class="full blue" onclick="login()">INICIAR SESIÓN</button>
<button class="full line" onclick="register()">REGISTRARSE</button>

<div id="msg"></div>
</div>
</div>

<!-- APP -->
<div id="app">
<div class="wrap">

<!-- LEFT -->
<div class="panel">
<div class="title">Usuarios</div>
<div class="scroll" id="users"></div>
</div>

<!-- CENTER -->
<div class="center">

<div id="profile">

<div class="big">
<img id="mypfp">
</div>

<h2 id="me"></h2>
<br>

<button class="blue full" onclick="pfp.click()">Cambiar Foto</button>
<input type="file" id="pfp" hidden onchange="uploadPfp()">

<br>

<button class="full" style="background:#555;color:#fff" onclick="logout()">LOG OUT</button>

<br>
<small>Selecciona un chat</small>

</div>

<div id="chat">

<div id="chatHead">Chat</div>

<div id="msgs"></div>

<div class="send">
<input id="txt" placeholder="Mensaje..." onkeypress="if(event.key==='Enter')sendText()">
<input type="file" id="media" hidden onchange="sendFile()">
<button class="blue" onclick="media.click()">Archivo</button>
<button class="blue" onclick="sendText()">Enviar</button>
<button onclick="closeChat()" style="background:#555;color:#fff">X</button>
</div>

</div>
</div>

<!-- RIGHT -->
<div class="panel">

<div class="title">Crear Grupo</div>

<input id="gname" placeholder="Nombre grupo">

<div class="scroll" id="selector"></div>

<button class="blue full" onclick="createGroup()">Crear Grupo</button>

<div class="title" style="margin-top:14px;">Mis Grupos</div>

<div class="scroll" id="groups"></div>

</div>

</div>
</div>

<script>
const API="https://bomb-review-olympic-integral.trycloudflare.com";

let ME=localStorage.getItem("username") || "";
let target="";
let isGroup=false;
let ws=null;

/* AUTO LOGIN */
if(ME){
showApp();
}

/* MSG */
function text(t,c="#aaa"){
msg.innerText=t;
msg.style.color=c;
}

/* AUTH */
async function register(){

let u=user.value.trim();
let p=pass.value.trim();

if(!u || !p){
text("Completa campos","#f44336");
return;
}

let r=await fetch(API+"/api/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u,password:p})
});

let d=await r.json();

if(r.ok){
text("Cuenta creada","#4caf50");
}else{
text(d.detail || "Error","#f44336");
}
}

async function login(){

let u=user.value.trim();
let p=pass.value.trim();

if(!u || !p){
text("Completa campos","#f44336");
return;
}

let r=await fetch(API+"/api/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:u,password:p})
});

let d=await r.json();

if(r.ok){
localStorage.setItem("username",u);
ME=u;
showApp();
}else{
text(d.detail || "Error","#f44336");
}
}

/* APP */
function showApp(){

auth.style.display="none";
app.style.display="block";

me.innerText="@"+ME;
mypfp.src=`${API}/media/pfp/${ME}.jpg?${Date.now()}`;

loadUsers();
loadGroups();
connectSocket();
}

function logout(){
localStorage.removeItem("username");
location.reload();
}

/* SOCKET */
function connectSocket(){

ws=new WebSocket(`wss://bomb-review-olympic-integral.trycloudflare.com/ws/${ME}`);

ws.onmessage=(event)=>{

let data=JSON.parse(event.data);

if(data.type==="chat"){
if(target) loadMsgs();
}

if(data.type==="users"){
loadUsers();
}
};

ws.onclose=()=>{
setTimeout(connectSocket,2000);
};
}

/* USERS */
async function loadUsers(){

let r=await fetch(`${API}/api/users/list/${ME}`);
let data=await r.json();

users.innerHTML="";
selector.innerHTML="";

data.forEach(u=>{

users.innerHTML+=`
<div class="user">
<img src="${API}/media/pfp/${u.username}.jpg" onerror="this.src='https://via.placeholder.com/44'">
<div class="${u.online?'online':'offline'}"></div>
<div class="name">${u.username}</div>
<button class="blue" onclick="openPrivate('${u.username}')">Chat</button>
</div>
`;

selector.innerHTML+=`
<div class="user">
<input type="checkbox" class="pick" value="${u.username}">
<div class="name">${u.username}</div>
</div>
`;

});
}

/* GROUPS */
async function loadGroups(){

let r=await fetch(`${API}/api/groups/list/${ME}`);
let data=await r.json();

groups.innerHTML="";

data.forEach(g=>{

groups.innerHTML+=`
<div class="user">
<div class="name">${g.name}</div>
<button class="blue" onclick="openGroup('${g.name}')">Abrir</button>
</div>
`;

});
}

async function createGroup(){

let n=gname.value.trim();
if(!n)return;

let members=[...document.querySelectorAll(".pick:checked")]
.map(x=>x.value)
.join(",");

let fd=new FormData();
fd.append("owner",ME);
fd.append("name",n);
fd.append("members",members);

await fetch(API+"/api/groups/create",{
method:"POST",
body:fd
});

gname.value="";
loadGroups();
}

/* CHAT */
function openPrivate(u){
target=u;
isGroup=false;
startChat("Chat con "+u);
}

function openGroup(g){
target=g;
isGroup=true;
startChat(g);
}

function startChat(t){

profile.style.display="none";
chat.style.display="flex";
chatHead.innerText=t;

loadMsgs();
}

function closeChat(){
chat.style.display="none";
profile.style.display="flex";
target="";
}

async function loadMsgs(){

if(!target)return;

let url=isGroup
?`${API}/api/groups/get/${ME}/${target}`
:`${API}/api/chat/get/${ME}/${target}`;

let r=await fetch(url);
let data=await r.json();

msgs.innerHTML=data.map(m=>{

let cls=m.sender===ME?"me":"them";
let c=m.message || "";

if(m.type==="image"){
c=`<img src="${API}/media/chat/${m.file}">`;
}

if(m.type==="video"){
c=`<video controls src="${API}/media/chat/${m.file}"></video>`;
}

return `<div class="msg ${cls}"><b>${m.sender}</b><br>${c}</div>`;

}).join("");

msgs.scrollTop=msgs.scrollHeight;
}

async function sendText(){

let m=txt.value.trim();
if(!m || !target)return;

let url=isGroup
?API+"/api/groups/send"
:API+"/api/chat/send";

await fetch(url,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
sender:ME,
receiver:target,
message:m
})
});

txt.value="";
loadMsgs();
}

async function sendFile(){

let f=media.files[0];
if(!f || !target)return;

let fd=new FormData();
fd.append("sender",ME);
fd.append("receiver",target);
fd.append("file",f);

let url=isGroup
?API+"/api/groups/upload"
:API+"/api/chat/upload";

await fetch(url,{
method:"POST",
body:fd
});

loadMsgs();
}

async function uploadPfp(){

let f=pfp.files[0];
if(!f)return;

let fd=new FormData();
fd.append("username",ME);
fd.append("file",f);

await fetch(API+"/api/user/pfp",{
method:"POST",
body:fd
});

mypfp.src=`${API}/media/pfp/${ME}.jpg?${Date.now()}`;
loadUsers();
}
</script>

</body>
</html>
