<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart-Chat</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
#app{display:none;width:100%;height:100%;grid-template-columns:30% 40% 30%}
#app.ready{display:grid}
.left,.right{padding:10px;background:#191919;overflow:auto}
.left{border-right:1px solid #303030}.right{border-left:1px solid #303030}
.center{display:flex;align-items:center;justify-content:center;background:#080808}
.title{color:#20d7ca;font-size:13px;font-weight:bold;margin-bottom:10px}
.user{display:flex;align-items:center;gap:7px;padding:6px;margin-bottom:6px;background:#212121;border:1px solid #303030;border-radius:8px}
.small-pfp{width:31px;height:31px;border-radius:50%;object-fit:cover;background:#303030}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
button{border:0;border-radius:6px;cursor:pointer}
.chat-btn,.create-btn{padding:6px 8px;background:#20d7ca;color:#06100f;font-size:9px;font-weight:bold}
.chat-btn:hover,.create-btn:hover{background:#2be0d3}
.profile{text-align:center}
.profile-pfp{width:150px;height:150px;border-radius:50%;object-fit:cover;background:#252525;border:3px solid #20d7ca}
.profile-name{margin-top:11px;font-size:15px;font-weight:bold}
.profile-source{margin-top:4px;color:#666;font-size:8px}
.logout{margin-top:12px;padding:7px 12px;background:#292929;color:#ddd;border:1px solid #383838}
input{width:100%;height:31px;margin:7px 0;padding:0 8px;background:#202020;border:1px solid #383838;border-radius:6px;color:#fff}
.groups-title{margin-top:12px}.group{padding:7px;margin-top:5px;background:#222;border:1px solid #303030;border-radius:6px;font-size:9px}
.status{position:fixed;left:6px;bottom:6px;padding:6px 9px;background:#181818;border:1px solid #333;border-radius:6px;font-size:8px;color:#777;opacity:0;z-index:999}
.status.show{opacity:1}.status.error{color:#ff7070}.status.ok{color:#20d7ca}
.chat{position:fixed;inset:0;display:none;grid-template-rows:45px 1fr 43px;background:#080808;z-index:10}
.chat.open{display:grid}
.chat-head{display:flex;align-items:center;gap:7px;padding:7px;background:#171717;border-bottom:1px solid #303030}
.back{width:29px;height:29px;background:#292929;color:#fff;font-size:14px}
.chat-head img{width:29px;height:29px;border-radius:50%;object-fit:cover}
.chat-name{font-size:10px;font-weight:bold}
.messages{overflow:auto;padding:9px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:7px 8px;border-radius:7px;font-size:10px;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:#19bcb0;color:#06100f}
.other{align-self:flex-start;background:#252525;color:#eee}
.bar{display:flex;gap:5px;padding:6px;background:#171717;border-top:1px solid #303030}
.bar input{margin:0}.send{width:40px;background:#20d7ca;color:#06100f}
@media(max-width:500px){#app{grid-template-columns:32% 36% 32%}}
</style>
</head>

<body>

<div id="app">

    <aside class="left">
        <div class="title">Usuarios</div>
        <div id="users">Cargando...</div>
    </aside>

    <main class="center">
        <div class="profile">
            <img id="myPfp" class="profile-pfp" alt="PFP">
            <div id="myName" class="profile-name">@...</div>
            <div class="profile-source">Kn Foundation Account</div>
            <button id="logout" class="logout">LOG OUT</button>
        </div>
    </main>

    <aside class="right">
        <div class="title">Grupos</div>

        <input id="groupName" placeholder="Nombre del grupo">

        <button id="createGroup" class="create-btn">
            Crear Grupo
        </button>

        <div class="title groups-title">Mis grupos</div>
        <div id="groups">Cargando...</div>
    </aside>

</div>

<section id="chat" class="chat">

    <header class="chat-head">
        <button id="back" class="back">←</button>
        <img id="chatPfp" alt="">
        <div id="chatName" class="chat-name">Chat</div>
    </header>

    <div id="messages" class="messages"></div>

    <form id="form" class="bar">
        <input id="message" maxlength="5000" placeholder="Escribe un mensaje..." autocomplete="off">
        <button class="send" type="submit">→</button>
    </form>

</section>

<div id="status" class="status"></div>

<script>
"use strict";

const API =
    "https://programs-sweet-limited-files.trycloudflare.com";

const AUTH =
    "https://smartium25.github.io/auth";

const TOKEN_KEY =
    "knfoundation_token";

let token = null;
let currentUser = null;
let currentTarget = null;
let socket = null;

const $ = id =>
    document.getElementById(id);

const app = $("app");
const status = $("status");


function show(text,type=""){
    status.textContent = text;
    status.className = "status show " + type;

    clearTimeout(show.timer);

    show.timer = setTimeout(() => {
        status.className = "status";
    },2500);
}


function placeholder(){
    return "data:image/svg+xml;charset=utf-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
                <rect width="100" height="100" fill="#303030"/>
                <circle cx="50" cy="35" r="18" fill="#777"/>
                <path d="M18 92C20 68 80 68 82 92" fill="#777"/>
            </svg>
        `);
}


function setImage(img,value){

    img.onerror = () => {
        img.onerror = null;
        img.src = placeholder();
    };

    if(!value){
        img.src = placeholder();
        return;
    }

    value = String(value).trim();

    /*
     * Kn Foundation debería devolver una URL
     * pública o absoluta para la PFP.
     */

    if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:")
    ){
        img.src = value;
    }else{
        img.src = placeholder();
    }
}


function getReturnedToken(){

    const hash =
        new URLSearchParams(
            location.hash.replace(/^#/,"")
        );

    const query =
        new URLSearchParams(
            location.search
        );

    return (
        hash.get("token") ||
        hash.get("access_token") ||
        query.get("token") ||
        query.get("access_token") ||
        null
    );
}


function login(){

    const redirect =
        location.href;

    const url =
        AUTH +
        "?redirect=" +
        encodeURIComponent(redirect) +
        "&app=smart-chat";

    location.replace(url);
}


function getStoredToken(){
    return localStorage.getItem(TOKEN_KEY);
}


async function api(path,options={}){

    const headers = {
        ...(options.headers || {})
    };

    headers.Authorization =
        "Bearer " + token;

    const response =
        await fetch(
            API + path,
            {
                ...options,
                headers
            }
        );

    let data = null;

    try{
        data = await response.json();
    }catch{}

    if(!response.ok){

        const error =
            new Error(
                data?.detail ||
                "Error HTTP " +
                response.status
            );

        error.status =
            response.status;

        throw error;
    }

    return data;
}


async function loadMe(){

    const data =
        await api("/api/me");

    if(
        !data?.user?.username
    ){
        throw new Error(
            "Kn Foundation no devolvió el usuario."
        );
    }

    currentUser =
        data.user.username;

    $("myName").textContent =
        "@" + currentUser;

    setImage(
        $("myPfp"),
        data.user.pfp ||
        data.user.profile_picture
    );
}


async function loadUsers(){

    const list =
        await api(
            "/api/users/list/" +
            encodeURIComponent(
                currentUser
            )
        );

    const box =
        $("users");

    box.innerHTML = "";

    if(
        !Array.isArray(list) ||
        list.length === 0
    ){

        box.textContent =
            "No hay usuarios.";

        return;
    }

    list.forEach(user => {

        const row =
            document.createElement("div");

        row.className =
            "user";

        const img =
            document.createElement("img");

        img.className =
            "small-pfp";

        setImage(
            img,
            user.pfp ||
            user.profile_picture
        );

        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            user.username;

        const button =
            document.createElement("button");

        button.className =
            "chat-btn";

        button.textContent =
            "Chat";

        button.onclick =
            () => openChat(user);

        row.append(
            img,
            name,
            button
        );

        box.appendChild(row);
    });
}


async function loadGroups(){

    const list =
        await api(
            "/api/groups/list/" +
            encodeURIComponent(
                currentUser
            )
        );

    const box =
        $("groups");

    box.innerHTML = "";

    if(
        !Array.isArray(list) ||
        list.length === 0
    ){

        box.textContent =
            "No tienes grupos.";

        return;
    }

    list.forEach(group => {

        const item =
            document.createElement("div");

        item.className =
            "group";

        item.textContent =
            group.name;

        box.appendChild(item);
    });
}


async function openChat(user){

    currentTarget =
        user.username;

    $("chatName").textContent =
        user.username;

    setImage(
        $("chatPfp"),
        user.pfp ||
        user.profile_picture
    );

    $("chat").classList.add(
        "open"
    );

    await loadMessages();

    $("message").focus();
}


async function loadMessages(){

    if(
        !currentTarget
    )return;

    const list =
        await api(
            "/api/chat/get/" +
            encodeURIComponent(
                currentUser
            ) +
            "/" +
            encodeURIComponent(
                currentTarget
            )
        );

    const box =
        $("messages");

    box.innerHTML = "";

    if(
        !Array.isArray(list) ||
        list.length === 0
    ){

        box.innerHTML =
            '<div style="margin:auto;color:#555;font-size:9px">No hay mensajes.</div>';

        return;
    }

    list.forEach(message => {

        const item =
            document.createElement("div");

        item.className =
            "msg " +
            (
                message.sender === currentUser
                    ? "mine"
                    : "other"
            );

        if(
            message.type === "image" &&
            message.file
        ){

            const img =
                document.createElement("img");

            img.style.maxWidth =
                "100%";

            img.style.borderRadius =
                "5px";

            img.src =
                API +
                "/media/chat/" +
                encodeURIComponent(
                    message.file
                );

            item.appendChild(img);

        }else if(
            message.type === "video" &&
            message.file
        ){

            const video =
                document.createElement("video");

            video.controls = true;
            video.style.maxWidth = "100%";

            video.src =
                API +
                "/media/chat/" +
                encodeURIComponent(
                    message.file
                );

            item.appendChild(video);

        }else{

            item.textContent =
                message.message || "";
        }

        box.appendChild(item);
    });

    box.scrollTop =
        box.scrollHeight;
}


$("form").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const input =
            $("message");

        const text =
            input.value.trim();

        if(
            !text ||
            !currentTarget
        )return;

        input.value = "";

        try{

            await api(
                "/api/chat/send",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        receiver:
                            currentTarget,
                        message:
                            text
                    })
                }
            );

            await loadMessages();

        }catch(error){

            handleError(error);
        }
    }
);


$("back").onclick =
    () => {

        $("chat").classList.remove(
            "open"
        );

        currentTarget =
            null;
    };


$("createGroup").onclick =
    async () => {

        const name =
            $("groupName").value.trim();

        if(!name){

            show(
                "Escribe un nombre.",
                "error"
            );

            return;
        }

        const form =
            new FormData();

        form.append(
            "name",
            name
        );

        form.append(
            "members",
            ""
        );

        try{

            await api(
                "/api/groups/create",
                {
                    method:"POST",
                    body:form
                }
            );

            $("groupName").value =
                "";

            await loadGroups();

            show(
                "Grupo creado.",
                "ok"
            );

        }catch(error){

            handleError(error);
        }
    };


$("logout").onclick =
    async () => {

        try{
            await api(
                "/api/logout",
                {
                    method:"POST"
                }
            );
        }catch{}

        if(socket){

            try{
                socket.close();
            }catch{}
        }

        localStorage.removeItem(
            TOKEN_KEY
        );

        location.replace(
            AUTH
        );
    };


function connectSocket(){

    if(
        !currentUser ||
        !token
    )return;

    const host =
        API.replace(
            /^https?:\/\//,
            ""
        );

    socket =
        new WebSocket(
            "wss://" +
            host +
            "/ws/" +
            encodeURIComponent(
                currentUser
            ) +
            "?token=" +
            encodeURIComponent(
                token
            )
        );

    socket.onmessage =
        async event => {

            try{

                const data =
                    JSON.parse(
                        event.data
                    );

                if(
                    data.type ===
                    "chat"
                ){

                    await loadUsers();

                    if(
                        currentTarget
                    ){
                        await loadMessages();
                    }
                }

            }catch{}
        };

    socket.onclose =
        () => {

            setTimeout(
                connectSocket,
                4000
            );
        };
}


function handleError(error){

    console.error(error);

    if(
        error?.status === 401
    ){

        localStorage.removeItem(
            TOKEN_KEY
        );

        token = null;

        app.classList.remove(
            "ready"
        );

        login();

        return;
    }

    show(
        error?.message ||
        "Ocurrió un error.",
        "error"
    );
}


async function init(){

    token =
        getReturnedToken() ||
        getStoredToken();

    /*
     * No hay sesión.
     * Smart-Chat permanece oculto.
     */

    if(!token){

        login();

        return;
    }

    localStorage.setItem(
        TOKEN_KEY,
        token
    );

    /*
     * Quitar token de la URL.
     */

    if(
        location.hash ||
        location.search.includes("token")
    ){

        history.replaceState(
            {},
            document.title,
            location.pathname
        );
    }

    try{

        await loadMe();

        /*
         * SOLO después de validar
         * la sesión mostramos Smart-Chat.
         */

        app.classList.add(
            "ready"
        );

        await loadUsers();
        await loadGroups();

        connectSocket();

    }catch(error){

        handleError(error);
    }
}


init();
</script>

</body>
</html>
