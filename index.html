<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Chat</title>

<style>
:root{
--primary:#00bcd4;
--bg:#121212;
--card:#2c2c2c;
--border:#444;
--text:#fff;
--sub:#aaa;
--green:#4caf50;
--red:#f44336;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Segoe UI,sans-serif;
background:var(--bg);
color:var(--text);
height:100vh;
overflow:hidden;
}

#app{
display:none;
height:100vh;
}

.wrap{
display:grid;
grid-template-columns:320px 1fr 320px;
height:100vh;
gap:2px;
background:var(--border);
}

.panel{
background:var(--bg);
padding:16px;
display:flex;
flex-direction:column;
overflow:hidden;
}

.title{
background:var(--card);
padding:14px;
border-radius:16px;
text-align:center;
font-weight:700;
color:var(--primary);
margin-bottom:14px;
}

.scroll{
flex:1;
overflow-y:auto;
}

.user{
display:flex;
align-items:center;
gap:10px;
background:var(--card);
padding:10px;
border-radius:14px;
margin-bottom:10px;
}

.user img{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
border:2px solid var(--primary);
}

.online,.offline{
width:10px;
height:10px;
border-radius:50%;
}

.online{background:var(--green);}
.offline{background:#666;}

.name{
flex:1;
font-weight:600;
}

.center{
background:#1a1a1a;
display:flex;
flex-direction:column;
height:100vh;
}

#profile{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
}

.big{
width:170px;
height:170px;
border-radius:50%;
overflow:hidden;
border:4px solid var(--primary);
margin-bottom:20px;
background:var(--card);
}

.big img{
width:100%;
height:100%;
object-fit:cover;
}

#chat{
display:none;
height:100%;
flex-direction:column;
}

#chatHead{
padding:15px;
background:var(--card);
color:var(--primary);
text-align:center;
font-weight:700;
}

#msgs{
flex:1;
overflow-y:auto;
padding:16px;
display:flex;
flex-direction:column;
gap:10px;
}

.msg{
padding:10px 14px;
border-radius:14px;
max-width:72%;
word-break:break-word;
}

.me{
align-self:flex-end;
background:var(--primary);
color:#000;
}

.them{
align-self:flex-start;
background:var(--card);
}

.msg img{
max-width:220px;
border-radius:12px;
}

.msg video{
max-width:240px;
border-radius:12px;
}

.send{
display:flex;
gap:8px;
padding:12px;
background:var(--card);
}

.send input{
margin:0;
}

input{
width:100%;
padding:14px;
border:none;
outline:none;
border-radius:12px;
background:#1d1d1d;
color:#fff;
margin-bottom:12px;
}

button{
border:none;
padding:14px;
border-radius:12px;
cursor:pointer;
font-weight:700;
}

.full{
width:100%;
}

.blue{
background:var(--primary);
color:#000;
}

small{
color:var(--sub);
}

@media(max-width:900px){
.wrap{
grid-template-columns:220px 1fr;
}

.wrap>.panel:last-child{
display:none;
}
}

@media(max-width:600px){
.wrap{
grid-template-columns:1fr;
}

.wrap>.panel:first-child{
display:none;
}

.center{
height:100vh;
}
}
</style>
</head>

<body>

<!-- APP -->
<div id="app">

<div class="wrap">

<!-- LEFT -->
<div class="panel">

<div class="title">
Usuarios
</div>

<div class="scroll" id="users"></div>

</div>


<!-- CENTER -->
<div class="center">

<div id="profile">

<div class="big">
<img id="mypfp">
</div>

<h2 id="me"></h2>

<br>

<button class="blue full" onclick="pfp.click()">
Cambiar Foto
</button>

<input
type="file"
id="pfp"
hidden
accept="image/*"
onchange="uploadPfp()"
>

<br>

<button
class="full"
style="background:#555;color:#fff"
onclick="logout()"
>
LOG OUT
</button>

<br>

<small>
Selecciona un chat
</small>

</div>


<div id="chat">

<div id="chatHead">
Chat
</div>

<div id="msgs"></div>

<div class="send">

<input
id="txt"
placeholder="Mensaje..."
onkeypress="if(event.key==='Enter')sendText()"
>

<input
type="file"
id="media"
hidden
onchange="sendFile()"
>

<button
class="blue"
onclick="media.click()"
>
Archivo
</button>

<button
class="blue"
onclick="sendText()"
>
Enviar
</button>

<button
onclick="closeChat()"
style="background:#555;color:#fff"
>
X
</button>

</div>

</div>

</div>


<!-- RIGHT -->
<div class="panel">

<div class="title">
Crear Grupo
</div>

<input
id="gname"
placeholder="Nombre grupo"
>

<div
class="scroll"
id="selector"
></div>

<button
class="blue full"
onclick="createGroup()"
>
Crear Grupo
</button>

<div
class="title"
style="margin-top:14px;"
>
Mis Grupos
</div>

<div
class="scroll"
id="groups"
></div>

</div>

</div>
</div>


<script>

// ============================================================
// CONFIGURACIÓN
// ============================================================

const API =
"https://spending-mode-drugs-encoding.trycloudflare.com";

const KN_FOUNDATION =
"https://smartium25.github.io/auth";

const TOKEN_KEY =
"knfoundation_token";


// ============================================================
// VARIABLES
// ============================================================

let TOKEN =
localStorage.getItem(TOKEN_KEY);

let ME = "";

let target = "";

let isGroup = false;

let ws = null;


// ============================================================
// REDIRECCIÓN A KN FOUNDATION
// ============================================================

function redirectToKnFoundation(){

const currentUrl =
window.location.href;

const redirect =
`${KN_FOUNDATION}/?redirect=${encodeURIComponent(currentUrl)}`;

window.location.replace(redirect);

}


// ============================================================
// HEADERS DE AUTENTICACIÓN
// ============================================================

function authHeaders(){

return {
"Authorization": `Bearer ${TOKEN}`
};

}


// ============================================================
// VERIFICAR SESIÓN
// ============================================================

async function verifySession(){

if(!TOKEN){

redirectToKnFoundation();

return false;

}

try{

const response =
await fetch(
`${API}/api/me`,
{
method:"GET",
headers:authHeaders()
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(TOKEN_KEY);

TOKEN = null;

redirectToKnFoundation();

return false;

}


if(!response.ok){

console.error(
"Error verificando sesión:",
response.status
);

return false;

}


const data =
await response.json();


// Acepta:
// {user:{username:"..."}} 
// o
// {username:"..."}

if(data.user){

ME =
data.user.username ||
data.user.email ||
"";

}else{

ME =
data.username ||
data.email ||
"";

}


if(!ME){

console.error(
"No se pudo obtener el usuario."
);

return false;

}


return true;

}catch(error){

console.error(
"Error conectando con Smart-Chat:",
error
);

return false;

}

}


// ============================================================
// INICIAR APP
// ============================================================

async function showApp(){

const valid =
await verifySession();

if(!valid){

return;

}


document.getElementById("app")
.style.display = "block";


document.getElementById("me")
.innerText = "@" + ME;


document.getElementById("mypfp")
.src =
`${API}/media/pfp/${encodeURIComponent(ME)}.jpg?${Date.now()}`;


loadUsers();

loadGroups();

connectSocket();

}


// ============================================================
// LOGOUT
// ============================================================

async function logout(){

try{

await fetch(
`${API}/api/logout`,
{
method:"POST",
headers:authHeaders()
}
);

}catch(error){

console.error(
"Error cerrando sesión:",
error
);

}


localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

ME = "";

if(ws){

ws.close();

}

redirectToKnFoundation();

}


// ============================================================
// SOCKET
// ============================================================

function connectSocket(){

if(!ME || !TOKEN){

return;

}


// IMPORTANTE:
// El backend de Smart-Chat debe aceptar el token
// como parámetro del WebSocket.

ws =
new WebSocket(
`wss://bomb-review-olympic-integral.trycloudflare.com/ws/${encodeURIComponent(ME)}?token=${encodeURIComponent(TOKEN)}`
);


ws.onopen = ()=>{

console.log(
"Smart-Chat conectado."
);

};


ws.onmessage = (event)=>{

try{

const data =
JSON.parse(event.data);


if(data.type === "chat"){

if(target){

loadMsgs();

}

}


if(data.type === "users"){

loadUsers();

}

}catch(error){

console.error(
"WebSocket:",
error
);

}

};


ws.onclose = ()=>{

console.log(
"WebSocket desconectado. Reintentando..."
);

setTimeout(()=>{

if(TOKEN && ME){

connectSocket();

}

},2000);

};

}


// ============================================================
// USUARIOS
// ============================================================

async function loadUsers(){

try{

const response =
await fetch(
`${API}/api/users/list/${encodeURIComponent(ME)}`,
{
headers:authHeaders()
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(TOKEN_KEY);

TOKEN = null;

redirectToKnFoundation();

return;

}


const data =
await response.json();


users.innerHTML = "";

selector.innerHTML = "";


data.forEach(u=>{


users.innerHTML += `

<div class="user">

<img
src="${API}/media/pfp/${encodeURIComponent(u.username)}.jpg"
onerror="this.src='https://via.placeholder.com/44'"
>

<div
class="${u.online ? 'online' : 'offline'}"
></div>

<div class="name">
${escapeHtml(u.username)}
</div>

<button
class="blue"
onclick="openPrivate('${escapeJs(u.username)}')"
>
Chat
</button>

</div>

`;


selector.innerHTML += `

<div class="user">

<input
type="checkbox"
class="pick"
value="${escapeHtml(u.username)}"
>

<div class="name">
${escapeHtml(u.username)}
</div>

</div>

`;

});

}catch(error){

console.error(
"Error cargando usuarios:",
error
);

}

}


// ============================================================
// GRUPOS
// ============================================================

async function loadGroups(){

try{

const response =
await fetch(
`${API}/api/groups/list/${encodeURIComponent(ME)}`,
{
headers:authHeaders()
}
);


if(!response.ok){

return;

}


const data =
await response.json();


groups.innerHTML = "";


data.forEach(g=>{

groups.innerHTML += `

<div class="user">

<div class="name">
${escapeHtml(g.name)}
</div>

<button
class="blue"
onclick="openGroup('${escapeJs(g.name)}')"
>
Abrir
</button>

</div>

`;

});

}catch(error){

console.error(
"Error cargando grupos:",
error
);

}

}


// ============================================================
// CREAR GRUPO
// ============================================================

async function createGroup(){

const n =
gname.value.trim();


if(!n){

return;

}


const members =
[
...document.querySelectorAll(".pick:checked")
]
.map(x=>x.value)
.join(",");


const fd =
new FormData();


fd.append(
"name",
n
);

fd.append(
"members",
members
);


try{

const response =
await fetch(
API + "/api/groups/create",
{
method:"POST",

headers:authHeaders(),

body:fd
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

redirectToKnFoundation();

return;

}


gname.value = "";

loadGroups();

}catch(error){

console.error(
"Error creando grupo:",
error
);

}

}


// ============================================================
// CHAT PRIVADO
// ============================================================

function openPrivate(u){

target = u;

isGroup = false;

startChat(
"Chat con " + u
);

}


// ============================================================
// CHAT DE GRUPO
// ============================================================

function openGroup(g){

target = g;

isGroup = true;

startChat(g);

}


// ============================================================
// ABRIR CHAT
// ============================================================

function startChat(t){

profile.style.display =
"none";

chat.style.display =
"flex";

chatHead.innerText =
t;

loadMsgs();

}


// ============================================================
// CERRAR CHAT
// ============================================================

function closeChat(){

chat.style.display =
"none";

profile.style.display =
"flex";

target = "";

}


// ============================================================
// CARGAR MENSAJES
// ============================================================

async function loadMsgs(){

if(!target){

return;

}


const url =
isGroup

? `${API}/api/groups/get/${encodeURIComponent(ME)}/${encodeURIComponent(target)}`

: `${API}/api/chat/get/${encodeURIComponent(ME)}/${encodeURIComponent(target)}`;


try{

const response =
await fetch(
url,
{
headers:authHeaders()
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

redirectToKnFoundation();

return;

}


const data =
await response.json();


msgs.innerHTML =
data.map(m=>{

const cls =
m.sender === ME
? "me"
: "them";


let c =
escapeHtml(
m.message || ""
);


if(m.type === "image"){

c =
`<img src="${API}/media/chat/${encodeURIComponent(m.file)}">`;

}


if(m.type === "video"){

c =
`<video controls src="${API}/media/chat/${encodeURIComponent(m.file)}"></video>`;

}


return `

<div class="msg ${cls}">

<b>
${escapeHtml(m.sender)}
</b>

<br>

${c}

</div>

`;

}).join("");


msgs.scrollTop =
msgs.scrollHeight;


}catch(error){

console.error(
"Error cargando mensajes:",
error
);

}

}


// ============================================================
// ENVIAR TEXTO
// ============================================================

async function sendText(){

const m =
txt.value.trim();


if(!m || !target){

return;

}


const url =
isGroup
? API + "/api/groups/send"
: API + "/api/chat/send";


try{

const response =
await fetch(
url,
{
method:"POST",

headers:{
...authHeaders(),
"Content-Type":
"application/json"
},

body:JSON.stringify({

receiver:target,

message:m

})
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

redirectToKnFoundation();

return;

}


txt.value = "";

loadMsgs();


}catch(error){

console.error(
"Error enviando mensaje:",
error
);

}

}


// ============================================================
// ENVIAR ARCHIVO
// ============================================================

async function sendFile(){

const f =
media.files[0];


if(!f || !target){

return;

}


const fd =
new FormData();


fd.append(
"receiver",
target
);

fd.append(
"file",
f
);


const url =
isGroup
? API + "/api/groups/upload"
: API + "/api/chat/upload";


try{

const response =
await fetch(
url,
{
method:"POST",

headers:authHeaders(),

body:fd
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

redirectToKnFoundation();

return;

}


media.value = "";

loadMsgs();


}catch(error){

console.error(
"Error enviando archivo:",
error
);

}

}


// ============================================================
// CAMBIAR FOTO DE PERFIL
// ============================================================

async function uploadPfp(){

const f =
pfp.files[0];


if(!f){

return;

}


const fd =
new FormData();


fd.append(
"file",
f
);


try{

const response =
await fetch(
API + "/api/user/pfp",
{
method:"POST",

headers:authHeaders(),

body:fd
}
);


if(
response.status === 401 ||
response.status === 403
){

localStorage.removeItem(
TOKEN_KEY
);

TOKEN = null;

redirectToKnFoundation();

return;

}


mypfp.src =
`${API}/media/pfp/${encodeURIComponent(ME)}.jpg?${Date.now()}`;


loadUsers();


}catch(error){

console.error(
"Error subiendo PFP:",
error
);

}

}


// ============================================================
// SEGURIDAD HTML
// ============================================================

function escapeHtml(text){

const div =
document.createElement("div");

div.textContent =
text ?? "";

return div.innerHTML;

}


function escapeJs(text){

return String(text)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'")
.replace(/"/g,'\\"')
.replace(/\n/g,"\\n")
.replace(/\r/g,"\\r");

}


// ============================================================
// INICIO
// ============================================================

async function init(){

/*
    SMART-CHAT
          ↓
    ¿Hay token?
       ↓ NO
    KN FOUNDATION
       ↓
      LOGIN
       ↓
    TOKEN
       ↓
    SMART-CHAT
       ↓
    API SMART-CHAT
*/

if(!TOKEN){

redirectToKnFoundation();

return;

}


await showApp();

}


init();

</script>

</body>
</html>
