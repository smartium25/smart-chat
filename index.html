<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Smart-Chat</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#090d12;
    color:#fff;
}

button,input,textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:grid;
    grid-template-columns:280px 1fr 280px;
    width:100%;
    height:100vh;
}

/* =========================
   LEFT
========================= */

.sidebar{
    background:#0d1218;
    border-right:1px solid #1d2933;
    display:flex;
    flex-direction:column;
    min-width:0;
}

.logo{
    height:65px;
    display:flex;
    align-items:center;
    padding:0 18px;
    border-bottom:1px solid #1d2933;
    color:#00eaff;
    font-size:21px;
    font-weight:bold;
}

.section-title{
    padding:16px 16px 9px;
    color:#7f929f;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.users-list{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 10px;
}

.user-card{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px;
    border-radius:10px;
    margin-bottom:4px;
    transition:background .15s;
}

.user-card:hover{
    background:#141d25;
}

.avatar-wrap{
    position:relative;
    width:42px;
    height:42px;
    flex-shrink:0;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#17222b;
    display:block;
}

.status-dot{
    position:absolute;
    right:-1px;
    bottom:0;
    width:11px;
    height:11px;
    border-radius:50%;
    background:#59636b;
    border:2px solid #0d1218;
}

.status-dot.online{
    background:#00e676;
}

.user-info{
    min-width:0;
    flex:1;
}

.username{
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-weight:bold;
    font-size:14px;
}

.user-status{
    color:#758590;
    font-size:11px;
    margin-top:3px;
}

.chat-btn{
    border:0;
    background:#17232c;
    color:#00eaff;
    width:32px;
    height:30px;
    border-radius:8px;
    font-size:16px;
}

.chat-btn:hover{
    background:#1c333f;
}

/* =========================
   CENTER
========================= */

.main{
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#090d12;
}

.topbar{
    height:65px;
    flex-shrink:0;
    border-bottom:1px solid #1d2933;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:12px;
}

.top-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    background:#17222b;
}

.chat-title{
    min-width:0;
}

.chat-name{
    font-size:15px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-sub{
    font-size:11px;
    color:#72828d;
    margin-top:3px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;
}

.empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#63727d;
    text-align:center;
}

.message{
    display:flex;
    margin-bottom:12px;
}

.message.mine{
    justify-content:flex-end;
}

.bubble{
    max-width:min(70%,550px);
    padding:10px 13px;
    border-radius:14px;
    background:#141d25;
    border:1px solid #202e38;
    word-wrap:break-word;
}

.message.mine .bubble{
    background:#063b46;
    border-color:#075765;
}

.message-user{
    font-size:11px;
    color:#00eaff;
    margin-bottom:4px;
    font-weight:bold;
}

.message-text{
    white-space:pre-wrap;
    line-height:1.4;
    font-size:14px;
}

.message-time{
    margin-top:5px;
    color:#65747e;
    font-size:9px;
    text-align:right;
}

.file-link{
    display:inline-block;
    color:#00eaff;
    text-decoration:none;
    margin-top:5px;
}

.composer{
    min-height:70px;
    border-top:1px solid #1d2933;
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px;
}

.composer textarea{
    flex:1;
    resize:none;
    height:44px;
    max-height:100px;
    border:1px solid #22313c;
    border-radius:10px;
    background:#10171e;
    color:#fff;
    outline:none;
    padding:12px;
}

.composer textarea:focus{
    border-color:#00bcd4;
}

.icon-btn,
.send-btn{
    width:44px;
    height:44px;
    border-radius:10px;
    border:1px solid #22313c;
    background:#10171e;
    color:#00eaff;
}

.send-btn{
    background:#00a9bd;
    border-color:#00a9bd;
    color:#001014;
    font-weight:bold;
}

.send-btn:hover{
    background:#00d4ec;
}

/* =========================
   RIGHT
========================= */

.rightbar{
    background:#0d1218;
    border-left:1px solid #1d2933;
    padding:15px;
    overflow-y:auto;
}

.profile-box{
    text-align:center;
    padding:10px 5px 18px;
    border-bottom:1px solid #1d2933;
}

.big-avatar{
    width:150px;
    height:150px;
    border-radius:50%;
    object-fit:cover;
    background:#17222b;
    margin:5px auto 13px;
    display:block;
}

.profile-name{
    font-size:17px;
    font-weight:bold;
}

.profile-status{
    font-size:11px;
    color:#71818b;
    margin-top:5px;
}

.panel-title{
    font-size:12px;
    color:#81929d;
    text-transform:uppercase;
    letter-spacing:1px;
    margin:18px 0 10px;
}

.group-form{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.group-form input{
    width:100%;
    border:1px solid #22313c;
    background:#10171e;
    color:#fff;
    outline:none;
    padding:10px;
    border-radius:8px;
}

.primary{
    border:0;
    background:#00a9bd;
    color:#001014;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
}

.members{
    max-height:180px;
    overflow-y:auto;
    border:1px solid #1d2933;
    border-radius:8px;
    padding:5px;
}

.member{
    display:flex;
    align-items:center;
    gap:7px;
    padding:6px;
    font-size:12px;
}

.member input{
    accent-color:#00d9ed;
}

.groups{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.group-item{
    padding:10px;
    background:#111a21;
    border:1px solid #1d2933;
    border-radius:8px;
    cursor:pointer;
}

.group-item:hover{
    border-color:#00a9bd;
}

.group-name{
    font-size:13px;
    font-weight:bold;
}

.group-members{
    color:#687983;
    font-size:10px;
    margin-top:3px;
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
    width:6px;
    height:6px;
}

::-webkit-scrollbar-track{
    background:transparent;
}

::-webkit-scrollbar-thumb{
    background:#26343d;
    border-radius:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){
    .app{
        grid-template-columns:220px 1fr;
    }

    .rightbar{
        display:none;
    }
}

@media(max-width:650px){
    .app{
        grid-template-columns:1fr;
    }

    .sidebar{
        display:none;
    }

    .messages{
        padding:12px;
    }

    .bubble{
        max-width:85%;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- LEFT -->
    <aside class="sidebar">

        <div class="logo">
            Smart-Chat
        </div>

        <div class="section-title">
            Usuarios
        </div>

        <div id="usersList" class="users-list"></div>

    </aside>


    <!-- CENTER -->
    <main class="main">

        <div class="topbar">

            <img
                id="chatAvatar"
                class="top-avatar"
                src=""
                alt=""
            >

            <div class="chat-title">

                <div
                    id="chatName"
                    class="chat-name"
                >
                    Smart-Chat
                </div>

                <div
                    id="chatSub"
                    class="chat-sub"
                >
                    Selecciona un usuario
                </div>

            </div>

        </div>


        <div
            id="messages"
            class="messages"
        >

            <div class="empty">
                Selecciona una conversación
            </div>

        </div>


        <div class="composer">

            <input
                id="fileInput"
                type="file"
                hidden
            >

            <button
                id="fileBtn"
                class="icon-btn"
                title="Enviar archivo"
            >
                📎
            </button>

            <textarea
                id="messageInput"
                placeholder="Escribe un mensaje..."
            ></textarea>

            <button
                id="sendBtn"
                class="send-btn"
            >
                ➤
            </button>

        </div>

    </main>


    <!-- RIGHT -->
    <aside class="rightbar">

        <div class="profile-box">

            <img
                id="myAvatar"
                class="big-avatar"
                src=""
                alt=""
            >

            <div
                id="myName"
                class="profile-name"
            >
                Cargando...
            </div>

            <div class="profile-status">
                Tu perfil
            </div>

        </div>


        <div class="panel-title">
            Crear grupo
        </div>

        <div class="group-form">

            <input
                id="groupName"
                type="text"
                placeholder="Nombre del grupo"
            >

            <div
                id="membersList"
                class="members"
            ></div>

            <button
                id="createGroupBtn"
                class="primary"
            >
                Crear grupo
            </button>

        </div>


        <div class="panel-title">
            Mis grupos
        </div>

        <div
            id="groupsList"
            class="groups"
        ></div>

    </aside>

</div>


<script>

/* =====================================
   CONFIGURACIÓN
===================================== */

const API =
"https://dive-still-minneapolis-held.trycloudflare.com";

const KN_AUTH_API =
"https://programs-sweet-limited-files.trycloudflare.com";

const AUTH_URL =
"https://smartium25.github.io/auth/";

const TOKEN_KEY =
"knfoundation_token";


/* =====================================
   ESTADO
===================================== */

let me = null;

let usersCache = [];

let groupsCache = [];

let currentType = null;

let currentTarget = null;

let socket = null;

let pingTimer = null;


/* =====================================
   HELPERS
===================================== */

function $(id){
    return document.getElementById(id);
}


function getToken(){

    return localStorage.getItem(TOKEN_KEY);

}


function authHeaders(){

    const token = getToken();

    return token
        ? {
            "Authorization":"Bearer "+token
        }
        : {};

}


async function api(path,options={}){

    const headers = {
        ...(options.headers || {}),
        ...authHeaders()
    };

    const response =
        await fetch(API+path,{
            ...options,
            headers
        });

    if(!response.ok){

        let text = "";

        try{
            text = await response.text();
        }catch{}

        throw new Error(
            "HTTP "+response.status+
            (text ? ": "+text : "")
        );

    }

    const type =
        response.headers.get("content-type") || "";

    if(type.includes("application/json")){
        return await response.json();
    }

    return await response.text();

}


function pfpUrl(value){

    if(!value){
        return "";
    }

    if(
        value.startsWith("http://") ||
        value.startsWith("https://") ||
        value.startsWith("data:")
    ){
        return value;
    }

    if(value.startsWith("/")){
        return API+value;
    }

    return API+"/"+value;

}


function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================
   CARGAR MI CUENTA
===================================== */

async function loadMe(){

    const data =
        await api("/api/me");

    me = data.user || data;

    $("myName").textContent =
        me.username || "Usuario";

    const avatar =
        pfpUrl(
            me.pfp ||
            me.profile_picture ||
            me.avatar
        );

    if(avatar){

        $("myAvatar").src = avatar;

    }

}


/* =====================================
   TARJETA DE USUARIO
===================================== */

function createUserCard(
    user,
    withControls=true
){

    const el =
        document.createElement("div");

    el.className =
        "user-card";

    /* IMPORTANTE:
       Se usa para actualizar
       esta tarjeta sin reconstruirla.
    */

    el.dataset.username =
        user.username;

    const avatar =
        pfpUrl(
            user.pfp ||
            user.profile_picture ||
            user.avatar
        );

    el.innerHTML = `

        <div class="avatar-wrap">

            <img
                class="avatar"
                src="${escapeHtml(avatar || "")}"
                alt=""
            >

            <span
                class="status-dot${user.online ? " online" : ""}"
            ></span>

        </div>

        <div class="user-info">

            <div class="username">
                ${escapeHtml(user.username)}
            </div>

            <div class="user-status">
                ${user.online ? "En línea" : "Desconectado"}
            </div>

        </div>

        ${
            withControls
            ?
            `
            <button
                class="chat-btn"
                title="Abrir chat"
            >
                💬
            </button>
            `
            :
            ""
        }

    `;


    if(withControls){

        const button =
            el.querySelector(".chat-btn");

        button.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                openPrivate(
                    user.username
                );

            }
        );

        el.addEventListener(
            "dblclick",
            () => {

                openPrivate(
                    user.username
                );

            }
        );

    }

    return el;

}


/* =====================================
   CARGAR USUARIOS
===================================== */

async function getUsers(){

    try{

        const data =
            await api(
                "/api/users/list/"+
                encodeURIComponent(me.username)
            );

        return Array.isArray(data)
            ? data
            : (data.users || []);

    }catch(error){

        console.warn(
            "API de Smart-Chat no respondió. Intentando Kn Foundation...",
            error
        );

        try{

            const response =
                await fetch(
                    KN_AUTH_API+"/api/users",
                    {
                        headers:authHeaders()
                    }
                );

            if(!response.ok){
                throw new Error(
                    "HTTP "+response.status
                );
            }

            const data =
                await response.json();

            return Array.isArray(data)
                ? data
                : (data.users || []);

        }catch(fallbackError){

            console.error(
                "No se pudieron cargar los usuarios:",
                fallbackError
            );

            return [];

        }

    }

}


/* =====================================
   CARGA INICIAL DE USUARIOS
===================================== */

async function loadUsers(){

    const users =
        await getUsers();

    usersCache =
        users.filter(
            user =>
                user &&
                user.username &&
                user.username !== me.username
        );

    const list =
        $("usersList");

    list.innerHTML = "";

    const members =
        $("membersList");

    members.innerHTML = "";


    usersCache.forEach(user => {

        list.appendChild(
            createUserCard(user,true)
        );


        const member =
            document.createElement("label");

        member.className =
            "member";

        member.innerHTML = `

            <input
                type="checkbox"
                value="${escapeHtml(user.username)}"
            >

            <span>
                ${escapeHtml(user.username)}
            </span>

        `;

        members.appendChild(member);

    });

}


/* =====================================
   REFRESH SILENCIOSO
===================================== */

async function refreshUsersSilently(){

    if(!me){
        return;
    }


    const users =
        await getUsers();


    const filtered =
        users.filter(
            user =>
                user &&
                user.username &&
                user.username !== me.username
        );


    usersCache =
        filtered;


    const list =
        $("usersList");


    /*
       NO hacemos:

       list.innerHTML = "";

       NO reconstruimos toda la lista.

       Solamente actualizamos
       lo que cambió.
    */


    const existing =
        new Map();


    list.querySelectorAll(
        ".user-card[data-username]"
    ).forEach(card => {

        existing.set(
            card.dataset.username,
            card
        );

    });


    filtered.forEach(user => {

        let card =
            existing.get(
                user.username
            );


        /*
           Si apareció un usuario nuevo,
           agregamos solamente su tarjeta.
        */

        if(!card){

            card =
                createUserCard(
                    user,
                    true
                );

            list.appendChild(card);

            return;

        }


        /*
           Estado online/offline
        */

        const dot =
            card.querySelector(
                ".status-dot"
            );

        const status =
            card.querySelector(
                ".user-status"
            );


        if(dot){

            const online =
                !!user.online;

            if(online){
                dot.classList.add("online");
            }else{
                dot.classList.remove("online");
            }

        }


        if(status){

            const text =
                user.online
                ? "En línea"
                : "Desconectado";

            if(status.textContent !== text){
                status.textContent = text;
            }

        }


        /*
           Foto de perfil
        */

        const image =
            card.querySelector(".avatar");


        const avatar =
            pfpUrl(
                user.pfp ||
                user.profile_picture ||
                user.avatar
            );


        if(
            image &&
            avatar &&
            image.getAttribute("src") !== avatar
        ){

            image.src = avatar;

        }

    });


    /*
       Eliminar solamente usuarios
       que ya no existen.
    */

    const valid =
        new Set(
            filtered.map(
                user => user.username
            )
        );


    existing.forEach(
        (card,username) => {

            if(!valid.has(username)){

                card.remove();

            }

        }
    );


    /*
       Actualizar subtítulo del chat abierto.
    */

    if(
        currentType === "private" &&
        currentTarget
    ){

        const user =
            filtered.find(
                item =>
                    item.username ===
                    currentTarget
            );


        if(user){

            $("chatSub").textContent =
                user.online
                ? "En línea"
                : "Desconectado";


            const avatar =
                pfpUrl(
                    user.pfp ||
                    user.profile_picture ||
                    user.avatar
                );


            if(
                avatar &&
                $("chatAvatar").src !== avatar
            ){

                $("chatAvatar").src =
                    avatar;

            }

        }

    }

}


/* =====================================
   GRUPOS
===================================== */

async function loadGroups(){

    try{

        const data =
            await api(
                "/api/groups/list/"+
                encodeURIComponent(me.username)
            );


        groupsCache =
            Array.isArray(data)
            ? data
            : (data.groups || []);


        renderGroups();

    }catch(error){

        console.error(
            "Error cargando grupos:",
            error
        );

        $("groupsList").innerHTML =
            "";

    }

}


function renderGroups(){

    const list =
        $("groupsList");

    list.innerHTML = "";


    if(!groupsCache.length){

        list.innerHTML = `
            <div style="
                color:#63727d;
                font-size:11px;
                padding:5px;
            ">
                No tienes grupos.
            </div>
        `;

        return;

    }


    groupsCache.forEach(group => {

        const item =
            document.createElement("div");

        item.className =
            "group-item";


        const members =
            group.members ||
            group.users ||
            [];


        item.innerHTML = `

            <div class="group-name">
                ${escapeHtml(
                    group.name ||
                    group.group_name ||
                    "Grupo"
                )}
            </div>

            <div class="group-members">
                ${
                    Array.isArray(members)
                    ? members.length+" miembros"
                    : ""
                }
            </div>

        `;


        item.addEventListener(
            "click",
            () => {

                openGroup(
                    group.id ||
                    group.group_id
                );

            }
        );


        list.appendChild(item);

    });

}


/* =====================================
   CHAT PRIVADO
===================================== */

async function openPrivate(username){

    currentType =
        "private";

    currentTarget =
        username;


    const user =
        usersCache.find(
            item =>
                item.username === username
        );


    $("chatName").textContent =
        username;


    $("chatSub").textContent =
        user && user.online
        ? "En línea"
        : "Desconectado";


    const avatar =
        user
        ?
        pfpUrl(
            user.pfp ||
            user.profile_picture ||
            user.avatar
        )
        :
        "";


    if(avatar){

        $("chatAvatar").src =
            avatar;

    }else{

        $("chatAvatar").removeAttribute(
            "src"
        );

    }


    await loadMessages();

}


/* =====================================
   CHAT DE GRUPO
===================================== */

async function openGroup(groupId){

    currentType =
        "group";

    currentTarget =
        groupId;


    const group =
        groupsCache.find(
            item =>
                (
                    item.id ||
                    item.group_id
                ) == groupId
        );


    $("chatName").textContent =
        group
        ? (
            group.name ||
            group.group_name ||
            "Grupo"
        )
        : "Grupo";


    $("chatSub").textContent =
        "Chat grupal";


    $("chatAvatar").removeAttribute(
        "src"
    );


    await loadMessages();

}


/* =====================================
   MENSAJES
===================================== */

async function loadMessages(){

    if(
        !currentType ||
        !currentTarget
    ){

        return;

    }


    const box =
        $("messages");


    try{

        let endpoint;


        if(currentType === "private"){

            endpoint =
                "/api/messages/private/"+
                encodeURIComponent(me.username)+
                "/"+
                encodeURIComponent(currentTarget);

        }else{

            endpoint =
                "/api/messages/group/"+
                encodeURIComponent(currentTarget);

        }


        const data =
            await api(endpoint);


        const messages =
            Array.isArray(data)
            ? data
            : (data.messages || []);


        renderMessages(messages);

    }catch(error){

        console.error(
            "Error cargando mensajes:",
            error
        );


        box.innerHTML = `
            <div class="empty">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}


/* =====================================
   RENDER MENSAJES
===================================== */

function renderMessages(messages){

    const box =
        $("messages");


    const shouldScroll =
        box.scrollHeight -
        box.scrollTop -
        box.clientHeight <
        120;


    box.innerHTML = "";


    if(!messages.length){

        box.innerHTML = `
            <div class="empty">
                No hay mensajes todavía.
            </div>
        `;

        return;

    }


    messages.forEach(message => {

        const sender =
            message.username ||
            message.sender ||
            message.from ||
            "";


        const text =
            message.content ??
            message.message ??
            message.text ??
            "";


        const mine =
            sender === me.username;


        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message"+
            (mine ? " mine" : "");


        let fileHtml = "";


        const file =
            message.file ||
            message.file_url ||
            message.attachment;


        if(file){

            const url =
                String(file).startsWith("http")
                ? file
                : API+(
                    String(file).startsWith("/")
                    ? String(file)
                    : "/"+String(file)
                );


            fileHtml = `

                <a
                    class="file-link"
                    href="${escapeHtml(url)}"
                    target="_blank"
                    rel="noopener"
                >
                    📎 Archivo
                </a>

            `;

        }


        const date =
            message.created_at ||
            message.timestamp ||
            "";


        let time = "";


        if(date){

            try{

                time =
                    new Date(date)
                    .toLocaleTimeString(
                        "es-MX",
                        {
                            hour:"2-digit",
                            minute:"2-digit"
                        }
                    );

            }catch{}

        }


        wrapper.innerHTML = `

            <div class="bubble">

                ${
                    !mine && sender
                    ?
                    `
                    <div class="message-user">
                        ${escapeHtml(sender)}
                    </div>
                    `
                    :
                    ""
                }

                ${
                    text
                    ?
                    `
                    <div class="message-text">
                        ${escapeHtml(text)}
                    </div>
                    `
                    :
                    ""
                }

                ${fileHtml}

                ${
                    time
                    ?
                    `
                    <div class="message-time">
                        ${escapeHtml(time)}
                    </div>
                    `
                    :
                    ""
                }

            </div>

        `;


        box.appendChild(wrapper);

    });


    if(shouldScroll){

        box.scrollTop =
            box.scrollHeight;

    }

}


/* =====================================
   ENVIAR MENSAJE
===================================== */

async function sendMessage(){

    if(
        !currentType ||
        !currentTarget
    ){

        return;

    }


    const input =
        $("messageInput");


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    input.value = "";


    try{

        if(currentType === "private"){

            await api(
                "/api/messages/private",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        sender:me.username,
                        recipient:currentTarget,
                        content:text
                    })
                }
            );

        }else{

            await api(
                "/api/messages/group",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        sender:me.username,
                        group_id:currentTarget,
                        content:text
                    })
                }
            );

        }


        await loadMessages();


    }catch(error){

        console.error(
            "Error enviando mensaje:",
            error
        );

        input.value =
            text;

    }

}


/* =====================================
   ENVIAR ARCHIVO
===================================== */

async function sendFile(file){

    if(
        !file ||
        !currentType ||
        !currentTarget
    ){

        return;

    }


    const form =
        new FormData();


    form.append(
        "file",
        file
    );


    form.append(
        "sender",
        me.username
    );


    if(currentType === "private"){

        form.append(
            "recipient",
            currentTarget
        );

    }else{

        form.append(
            "group_id",
            currentTarget
        );

    }


    try{

        await api(
            "/api/messages/file",
            {
                method:"POST",
                body:form
            }
        );


        await loadMessages();

    }catch(error){

        console.error(
            "Error enviando archivo:",
            error
        );

    }

}


/* =====================================
   CREAR GRUPO
===================================== */

async function createGroup(){

    const name =
        $("groupName")
        .value
        .trim();


    if(!name){

        return;

    }


    const selected =
        Array.from(
            $("membersList")
            .querySelectorAll(
                "input[type=checkbox]:checked"
            )
        )
        .map(
            input =>
                input.value
        );


    try{

        await api(
            "/api/groups/create",
            {
                method:"POST",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    name:name,
                    owner:me.username,
                    members:[
                        me.username,
                        ...selected
                    ]
                })
            }
        );


        $("groupName").value =
            "";


        $("membersList")
            .querySelectorAll(
                "input[type=checkbox]"
            )
            .forEach(
                checkbox =>
                    checkbox.checked = false
            );


        await loadGroups();


    }catch(error){

        console.error(
            "Error creando grupo:",
            error
        );

    }

}


/* =====================================
   WEBSOCKET
===================================== */

function connectSocket(){

    if(!me){

        return;

    }


    if(socket){

        try{
            socket.close();
        }catch{}

    }


    const token =
        getToken();


    if(!token){

        console.warn(
            "No existe "+TOKEN_KEY
        );

        return;

    }


    const wsBase =
        API
        .replace(
            /^https:/,
            "wss:"
        )
        .replace(
            /^http:/,
            "ws:"
        );


    const url =
        wsBase+
        "/ws/"+
        encodeURIComponent(
            me.username
        )+
        "?token="+
        encodeURIComponent(token);


    try{

        socket =
            new WebSocket(url);

    }catch(error){

        console.error(
            "WebSocket:",
            error
        );

        return;

    }


    socket.addEventListener(
        "open",
        () => {

            console.log(
                "Smart-Chat conectado"
            );


            if(pingTimer){
                clearInterval(pingTimer);
            }


            pingTimer =
                setInterval(
                    () => {

                        if(
                            socket &&
                            socket.readyState ===
                            WebSocket.OPEN
                        ){

                            socket.send(
                                JSON.stringify({
                                    type:"ping"
                                })
                            );

                        }

                    },
                    25000
                );

        }
    );


    socket.addEventListener(
        "message",
        async event => {

            try{

                const data =
                    JSON.parse(
                        event.data
                    );


                if(
                    data.type ===
                    "chat"
                ){

                    if(
                        currentType &&
                        currentTarget
                    ){

                        await loadMessages();

                    }

                }


            }catch(error){

                console.warn(
                    "Mensaje WS inválido:",
                    error
                );

            }

        }
    );


    socket.addEventListener(
        "close",
        () => {

            if(pingTimer){

                clearInterval(
                    pingTimer
                );

                pingTimer = null;

            }


            /*
               Reconexión sin recargar
               la página.
            */

            setTimeout(
                () => {

                    if(me){
                        connectSocket();
                    }

                },
                3000
            );

        }
    );


    socket.addEventListener(
        "error",
        error => {

            console.warn(
                "WebSocket error:",
                error
            );

        }
    );

}


/* =====================================
   EVENTOS
===================================== */

$("sendBtn")
.addEventListener(
    "click",
    sendMessage
);


$("messageInput")
.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


$("fileBtn")
.addEventListener(
    "click",
    () => {

        $("fileInput").click();

    }
);


$("fileInput")
.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];


        if(file){

            await sendFile(file);

        }


        event.target.value = "";

    }
);


$("createGroupBtn")
.addEventListener(
    "click",
    createGroup
);


/* =====================================
   INICIO
===================================== */

async function init(){

    const token =
        getToken();


    if(!token){

        window.location.href =
            AUTH_URL;

        return;

    }


    try{

        await loadMe();

        await loadUsers();

        await loadGroups();

        connectSocket();


        /*
           IMPORTANTE:

           Esto NO recarga la lista.
           Solo cambia estados, PFPs,
           usuarios nuevos/eliminados
           y el estado del chat.

           Así no existe el efecto
           visual de que todo desaparece.
        */

        setInterval(
            async () => {

                try{

                    await refreshUsersSilently();

                }catch(error){

                    console.error(
                        "Error actualizando usuarios:",
                        error
                    );

                }

            },
            10000
        );


    }catch(error){

        console.error(
            "Error iniciando Smart-Chat:",
            error
        );


        $("chatName").textContent =
            "Error";


        $("chatSub").textContent =
            error.message ||
            "No se pudo conectar con el servidor";

    }

}


init();

</script>
