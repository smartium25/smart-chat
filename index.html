<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart-Chat</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808;color:#fff;font-family:Arial;overflow:hidden}
#app{display:none;width:100%;height:100%;grid-template-columns:30% 40% 30%}
#app.ready{display:grid}

.left,.right{padding:10px;background:#191919;overflow:auto}
.left{border-right:1px solid #303030}
.right{border-left:1px solid #303030}
.center{display:flex;align-items:center;justify-content:center;background:#080808}

.title{color:#20d7ca;font-size:13px;font-weight:bold;margin-bottom:10px}

.user{
    display:flex;align-items:center;gap:7px;
    background:#212121;border:1px solid #303030;
    border-radius:8px;padding:6px;margin-bottom:6px
}
.avatar-small{width:31px;height:31px;border-radius:50%;object-fit:cover;background:#333}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}

.chat-btn,.create-btn{
    background:#20d7ca;color:#07100f;border:0;border-radius:5px;
    padding:6px 8px;font-size:9px;font-weight:bold;cursor:pointer
}

.profile{text-align:center}
.profile img{
    width:150px;height:150px;
    border-radius:50%;object-fit:cover;
    background:#292929;
    border:3px solid #20d7ca
}
.profile-name{margin-top:10px;font-size:15px;font-weight:bold}
.profile-source{color:#666;font-size:8px;margin-top:4px}
.logout{
    margin-top:12px;padding:7px 12px;
    background:#292929;color:#ddd;
    border:1px solid #383838;border-radius:6px;
    cursor:pointer;font-size:9px
}

input{
    width:100%;height:31px;margin:7px 0;
    padding:0 8px;background:#202020;
    border:1px solid #383838;border-radius:6px;color:white
}

#groups{margin-top:7px}
.group{padding:7px;background:#222;border:1px solid #303030;border-radius:6px;margin-top:5px;font-size:9px}

.status{
    position:fixed;bottom:6px;left:6px;
    background:#181818;border:1px solid #333;
    padding:6px 9px;border-radius:6px;
    font-size:8px;color:#777;opacity:0
}
.status.show{opacity:1}.status.error{color:#ff7070}.status.ok{color:#20d7ca}

.chat{
    position:fixed;inset:0;background:#080808;
    display:none;grid-template-rows:45px 1fr 43px;z-index:10
}
.chat.open{display:grid}
.chat-head{display:flex;align-items:center;gap:7px;padding:7px;background:#171717;border-bottom:1px solid #303030}
.back{width:29px;height:29px;background:#292929;color:#fff;border:0;border-radius:6px;cursor:pointer}
.chat-head img{width:29px;height:29px;border-radius:50%;object-fit:cover}
.chat-name{font-size:10px;font-weight:bold}
.messages{overflow:auto;padding:9px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:75%;padding:7px 8px;border-radius:7px;font-size:10px}
.mine{align-self:flex-end;background:#19bcb0;color:#06100f}
.other{align-self:flex-start;background:#252525}
.bar{display:flex;gap:5px;padding:6px;background:#171717;border-top:1px solid #303030}
.bar input{margin:0}.send{width:40px;background:#20d7ca;border:0;border-radius:6px;cursor:pointer}

@media(max-width:500px){
    #app{grid-template-columns:32% 36% 32%}
}
</style>
</head>

<body>

<div id="app">

    <aside class="left">
        <div class="title">Usuarios</div>
        <div id="users">Cargando...</div>
    </aside>

    <main class="center">
        <div class="profile">
            <img id="myPfp" alt="PFP">
            <div id="myName" class="profile-name">@...</div>
            <div class="profile-source">Kn Foundation Account</div>
            <button id="logout" class="logout">LOG OUT</button>
        </div>
    </main>

    <aside class="right">
        <div class="title">Grupos</div>

        <input id="groupName" placeholder="Nombre del grupo">

        <button id="createGroup" class="create-btn">
            Crear Grupo
        </button>

        <div class="title" style="margin-top:15px">
            Mis grupos
        </div>

        <div id="groups">Cargando...</div>
    </aside>

</div>

<section id="chat" class="chat">

    <header class="chat-head">
        <button id="back" class="back">←</button>
        <img id="chatPfp">
        <div>
            <div id="chatName" class="chat-name">Chat</div>
        </div>
    </header>

    <div id="messages" class="messages"></div>

    <form id="form" class="bar">
        <input id="message" placeholder="Escribe un mensaje..." maxlength="5000">
        <button class="send">→</button>
    </form>

</section>

<div id="status" class="status"></div>

<script>
const API="https://programs-sweet-limited-files.trycloudflare.com";
const AUTH="https://smartium25.github.io/auth";

let token=null,currentUser=null,target=null,socket=null;

const $=id=>document.getElementById(id);

const app=$("app");
const users=$("users");
const groups=$("groups");
const status=$("status");


function show(text,type=""){
    status.textContent=text;
    status.className="status show "+type;
    clearTimeout(show.t);
    show.t=setTimeout(()=>status.className="status",2500);
}


function placeholder(){
    return "data:image/svg+xml,"+encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <rect width="100" height="100" fill="#303030"/>
            <circle cx="50" cy="35" r="18" fill="#777"/>
            <path d="M18 92C20 68 80 68 82 92" fill="#777"/>
        </svg>
    `);
}


function pfp(v){
    if(!v)return placeholder();
    if(v.startsWith("http")||v.startsWith("data:"))return v;
    return "http://127.0.0.1:8000/"+v.replace(/^\/+/,"");
}


function getToken(){

    const hash=new URLSearchParams(
        location.hash.replace(/^#/,"")
    );

    const query=new URLSearchParams(location.search);

    return hash.get("token") ||
           hash.get("access_token") ||
           query.get("token") ||
           query.get("access_token") ||
           localStorage.getItem("token");
}


function goAuth(){

    const url=AUTH+"?redirect="+
        encodeURIComponent(location.href)+
        "&app=smart-chat";

    location.replace(url);
}


async function api(path,options={}){

    const headers={...(options.headers||{})};

    if(token)
        headers.Authorization="Bearer "+token;

    const r=await fetch(API+path,{...options,headers});

    let data=null;

    try{data=await r.json()}catch{}

    if(!r.ok){
        const e=new Error(data?.detail||"Error HTTP "+r.status);
        e.status=r.status;
        throw e;
    }

    return data;
}


async function loadMe(){

    const d=await api("/api/me");

    if(!d?.user?.username)
        throw new Error("No se pudo obtener la cuenta.");

    currentUser=d.user.username;

    $("myName").textContent="@"+currentUser;

    $("myPfp").src=
        pfp(d.user.pfp||d.user.profile_picture);
}


async function loadUsers(){

    const list=await api(
        "/api/users/list/"+
        encodeURIComponent(currentUser)
    );

    users.innerHTML="";

    if(!Array.isArray(list)||!list.length){
        users.textContent="No hay usuarios.";
        return;
    }

    list.forEach(u=>{

        const row=document.createElement("div");
        row.className="user";

        const img=document.createElement("img");
        img.className="avatar-small";
        img.src=pfp(u.pfp||u.profile_picture);

        const name=document.createElement("div");
        name.className="name";
        name.textContent=u.username;

        const btn=document.createElement("button");
        btn.className="chat-btn";
        btn.textContent="Chat";
        btn.onclick=()=>openChat(u);

        row.append(img,name,btn);
        users.appendChild(row);
    });
}


async function loadGroups(){

    const list=await api(
        "/api/groups/list/"+
        encodeURIComponent(currentUser)
    );

    groups.innerHTML="";

    if(!Array.isArray(list)||!list.length){
        groups.textContent="No tienes grupos.";
        return;
    }

    list.forEach(g=>{
        const x=document.createElement("div");
        x.className="group";
        x.textContent=g.name;
        groups.appendChild(x);
    });
}


async function openChat(u){

    target=u.username;

    $("chatName").textContent=u.username;
    $("chatPfp").src=pfp(u.pfp||u.profile_picture);

    $("chat").classList.add("open");

    await loadMessages();
}


async function loadMessages(){

    const list=await api(
        "/api/chat/get/"+
        encodeURIComponent(currentUser)+"/"+
        encodeURIComponent(target)
    );

    const box=$("messages");
    box.innerHTML="";

    if(!list.length){
        box.innerHTML=
            '<div style="margin:auto;color:#555;font-size:9px">No hay mensajes.</div>';
        return;
    }

    list.forEach(m=>{

        const x=document.createElement("div");

        x.className=
            "msg "+
            (m.sender===currentUser?"mine":"other");

        x.textContent=m.message||"";

        box.appendChild(x);
    });

    box.scrollTop=box.scrollHeight;
}


$("form").addEventListener("submit",async e=>{

    e.preventDefault();

    const text=$("message").value.trim();

    if(!text||!target)return;

    $("message").value="";

    try{

        await api("/api/chat/send",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                receiver:target,
                message:text
            })
        });

        await loadMessages();

    }catch(e){
        show(e.message,"error");
    }
});


$("back").onclick=()=>{
    $("chat").classList.remove("open");
    target=null;
};


$("createGroup").onclick=async()=>{

    const name=$("groupName").value.trim();

    if(!name){
        show("Escribe un nombre.","error");
        return;
    }

    const form=new FormData();
    form.append("name",name);
    form.append("members","");

    try{

        await api("/api/groups/create",{
            method:"POST",
            body:form
        });

        $("groupName").value="";

        await loadGroups();

        show("Grupo creado.","ok");

    }catch(e){
        show(e.message,"error");
    }
};


$("logout").onclick=async()=>{

    try{
        await api("/api/logout",{method:"POST"});
    }catch{}

    localStorage.removeItem("token");

    if(socket){
        try{socket.close()}catch{}
    }

    goAuth();
};


function connectSocket(){

    const host=
        API.replace(/^https?:\/\//,"");

    socket=new WebSocket(
        "wss://"+
        host+
        "/ws/"+
        encodeURIComponent(currentUser)+
        "?token="+
        encodeURIComponent(token)
    );

    socket.onmessage=async e=>{

        try{

            const d=JSON.parse(e.data);

            if(d.type==="chat"){
                await loadUsers();
                if(target)await loadMessages();
            }

        }catch{}
    };

    socket.onclose=()=>{
        setTimeout(connectSocket,4000);
    };
}


async function init(){

    token=getToken();

    if(!token){
        goAuth();
        return;
    }

    localStorage.setItem("token",token);

    /*
     * Limpiar el token de la URL.
     */

    if(location.hash||location.search.includes("token")){
        history.replaceState(
            {},
            document.title,
            location.pathname
        );
    }

    try{

        await loadMe();

        app.classList.add("ready");

        await loadUsers();
        await loadGroups();

        connectSocket();

    }catch(e){

        if(e.status===401){
            localStorage.removeItem("token");
            goAuth();
            return;
        }

        app.classList.add("ready");
        show(e.message,"error");
    }
}

init();
</script>

</body>
</html>
